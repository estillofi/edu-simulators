    surprise:     { group: 'Удивление', title: 'Удивился',             when: 'верный нестандартный ход в открытом задании',     pose: 'idea',    motion: 'startle', fx: ['bang'],             phrases: ['Ого, интересно!', 'Неожиданный ход!'],                       hold: 2400 },
  };

  const COLORS = ['#ffc93c', '#ff8a3d', '#5cc8ff', '#7be07b', '#ff6fa8', '#b18cff'];
  const HEART = '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.6 3 5 6.6 5c2 0 3.4 1.1 5.4 3.2C14 6.1 15.4 5 17.4 5 21 5 23 8.6 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg>';
  const STAR = '<svg viewBox="0 0 24 24"><path d="M12 1.5l2.6 7.1 7.4.3-5.8 4.7 2 7.3L12 16.7 5.8 20.9l2-7.3L2 8.9l7.4-.3z"/></svg>';
  const ARROW = '<svg viewBox="0 0 54 30" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15h42M34 4l12 11-12 11"/></svg>';

  const rnd = (a, b) => a + Math.random() * (b - a);

  function pick(list, last) {
    if (!list || !list.length) return '';
    if (list.length === 1) return list[0];
    let p;
    do { p = list[Math.floor(Math.random() * list.length)]; } while (p === last);
    return p;
  }

  function mount(root, options) {
    const opts = options || {};
    const facing = opts.facing || root.dataset.facing || 'right';
    const base = opts.base != null ? opts.base : 'poses/';
    const behaviors = Object.assign({}, BEHAVIORS, opts.behaviors);
    const dir = facing === 'left' ? -1 : 1;
    const X = (x) => (dir === 1 ? x : 100 - x);

    root.classList.add('kori');
    root.style.setProperty('--dir', dir);
    root.dataset.facing = facing;
    root.innerHTML =
      '<div class="kori__bubble" role="status" aria-live="polite"></div>' +
      '<div class="kori__stage">' +
        '<div class="kori__back" aria-hidden="true"></div>' +
        '<div class="kori__shadow" aria-hidden="true"></div>' +
        '<div class="kori__body"><div class="kori__attached" aria-hidden="true"></div></div>' +
        '<div class="kori__front" aria-hidden="true"></div>' +
      '</div>';

    const $ = (s) => root.querySelector(s);
    const body = $('.kori__body'), bubble = $('.kori__bubble');
    const layers = { back: $('.kori__back'), attached: $('.kori__attached'), front: $('.kori__front') };

    // Все позы грузятся сразу и лежат стопкой: смена мгновенная
    const imgs = {};
    for (const [role, file] of Object.entries(POSES)) {
      const img = new Image();
      img.className = 'kori__pose';
      img.src = (opts.srcs && opts.srcs[role]) || base + file;
      img.alt = '';
      img.decoding = 'async';
      body.insertBefore(img, layers.attached);
      imgs[role] = img;
    }

    function el(layer, cls, at, vars, html) {
      const e = document.createElement('div');
      e.className = 'fx ' + cls;
      e.style.setProperty('--x', X(at.x) + '%');
      e.style.setProperty('--y', at.y + '%');
      for (const [k, v] of Object.entries(vars || {})) e.style.setProperty(k, v);
      if (html) e.innerHTML = html;
      layers[layer].appendChild(e);
      return e;
    }

    // Каждый эффект знает свой слой и точку привязки
    const FX = {
      sparks() {
        COLORS.forEach((c, i) => {
          const a = (i / COLORS.length) * Math.PI * 2 - Math.PI / 2;
          el('front', 'fx-spark', AT.chest, { '--c': c, '--dx': Math.round(Math.cos(a) * 120) + 'px', '--dy': Math.round(Math.sin(a) * 110) + 'px' });
        });
      },
      confetti() {
        for (let i = 0; i < 26; i++) {
          el('front', 'fx-confetti', { x: rnd(4, 96), y: 0 }, {
            '--c': COLORS[i % COLORS.length], '--dx': Math.round(rnd(-40, 40)) + 'px',
            '--r': Math.round(rnd(200, 720)) + 'deg', '--d': rnd(0, .5).toFixed(2) + 's', '--t': rnd(1.4, 2.2).toFixed(2) + 's',
          });
        }
      },
      hearts() {
        for (let i = 0; i < 5; i++) {
          el('front', 'fx-heart', { x: (i % 2 ? 84 : 16) + rnd(-5, 5), y: AT.chest.y - 4 }, {
            '--d': (i * .18).toFixed(2) + 's', '--dx': Math.round(rnd(-30, 30)) + 'px', '--s': Math.round(rnd(16, 26)) + 'px',
          }, HEART);
        }
      },
      stars() {
        const spots = [[18, 22], [84, 18], [12, 58], [90, 52], [50, 2], [74, 70]];
        spots.forEach(([x, y], i) => el('front', 'fx-star', { x, y }, { '--d': (i * .12).toFixed(2) + 's', '--s': Math.round(rnd(16, 28)) + 'px' }, STAR));
      },
      zzz() {
        [0, .8, 1.6].forEach((d, i) => {
          const z = el('front', 'fx-z', { x: 62, y: 14 }, { '--d': d + 's' });
          z.textContent = 'Z';
          z.style.fontSize = 16 + i * 5 + 'px';
        });
      },
      dots() { el('front', 'fx-dots', { x: 82, y: 6 }, {}, '<i></i><i></i><i></i>'); },
      qmarks() {
        [[20, 10, -15], [80, 4, 12], [88, 22, 20]].forEach(([x, y, r], i) => {
          el('front', 'fx-q', { x, y }, { '--d': (i * .2).toFixed(1) + 's', '--r': r * dir + 'deg' }).textContent = '?';
        });
      },
      bang() { el('front', 'fx-bang', { x: 64, y: 2 }).textContent = '!'; },
      glow() { el('attached', 'fx-glow', AT.bulb); },
      rays() { el('back', 'fx-rays', AT.center); },
      ring() { [0, .35].forEach((d) => el('back', 'fx-ring', AT.feet, { '--d': d + 's' })); },
      badge(text) { el('front', 'fx-badge', { x: 86, y: 14 }).textContent = text || '×3'; },
      arrow() { el('front', 'fx-arrow', { x: 96, y: 58 }, {}, ARROW); },
      drop() { el('attached', 'fx-drop', AT.brow); },
    };

    let timer = 0;
    let current = '';
    const lastPhrase = {};

    function play(name, text) {
      const b = behaviors[name] || behaviors.idle;
      if (!behaviors[name]) name = 'idle';
      clearTimeout(timer);

      for (const [role, img] of Object.entries(imgs)) img.classList.toggle('is-active', role === b.pose);
      for (const l of Object.values(layers)) l.querySelectorAll('.fx').forEach((n) => n.remove());

      // Сброс и перезапуск, даже если поведение то же самое (два верных подряд — два прыжка)
      root.removeAttribute('data-motion');
      bubble.classList.remove('is-shown');
      void root.offsetWidth;
      root.dataset.motion = b.motion;
      root.dataset.behavior = name;
      root.toggleAttribute('data-own-shadow', OWN_SHADOW.has(b.pose));

      for (const f of b.fx) {
        const [key, arg] = f.split(':');
        if (FX[key]) FX[key](arg);
      }

      const phrase = text != null ? text : pick(b.phrases, lastPhrase[name]);
      lastPhrase[name] = phrase;
      if (phrase) {
        bubble.textContent = phrase;
        bubble.classList.add('is-shown');
      }

      if (b.hold) timer = setTimeout(() => play('idle', ''), b.hold);
      current = name;
      root.dispatchEvent(new CustomEvent('kori:state', { bubbles: true, detail: { behavior: name, phrase, facing } }));
    }

    // Совместимость с первой версией: detail.state тоже принимается
    const onEvent = (e) => {
      const d = e.detail || {};
      if (d.facing && d.facing !== facing) return;
      play(d.behavior || d.state, d.text);
    };
    window.addEventListener('kori:react', onEvent);

    play(opts.start || 'idle', '');
    return {
      play,
      react: play,
      get current() { return current; },
      facing,
      destroy() {
        clearTimeout(timer);
        window.removeEventListener('kori:react', onEvent);
        root.innerHTML = '';
      },
    };
  }

  window.Kori = { mount, BEHAVIORS, POSES };
})();

// Рисунки приборов: плоский фронтальный вид, яркие материалы. Все функции возвращают строки SVG.
// Предмет рисуется от точки опоры (0,0) — середина низа — вверх (y < 0).
const ART = (() => {
  const r1 = (v) => Math.round(v * 10) / 10;
  const defs = `<defs>
    <linearGradient id="g-brass" x1="0" x2="1"><stop offset="0" stop-color="#8A6416"/><stop offset=".28" stop-color="#F6D27A"/><stop offset=".55" stop-color="#E0B04A"/><stop offset="1" stop-color="#7C5A12"/></linearGradient>
    <linearGradient id="g-brass-top" x1="0" x2="1"><stop offset="0" stop-color="#B98A2A"/><stop offset=".4" stop-color="#FFE7A6"/><stop offset="1" stop-color="#A57A1E"/></linearGradient>
    <linearGradient id="g-steel" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#A9B6C2"/><stop offset=".45" stop-color="#6F7F8D"/><stop offset="1" stop-color="#3E4B56"/></linearGradient>
    <linearGradient id="g-al" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#C9D2DA"/><stop offset="1" stop-color="#8E9BA6"/></linearGradient>
    <linearGradient id="g-wood" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#F0CB92"/><stop offset="1" stop-color="#C38D4F"/></linearGradient>
    <linearGradient id="g-gold" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#FFF0A8"/><stop offset=".45" stop-color="#E3B63A"/><stop offset="1" stop-color="#8E6510"/></linearGradient>
    <linearGradient id="g-col" x1="0" x2="1"><stop offset="0" stop-color="#2E4A63"/><stop offset=".4" stop-color="#6E8FAA"/><stop offset="1" stop-color="#22394E"/></linearGradient>
    <linearGradient id="g-beam" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8FB0C9"/><stop offset=".5" stop-color="#3C6585"/><stop offset="1" stop-color="#1F3D55"/></linearGradient>
    <linearGradient id="g-pan" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#E9EEF2"/><stop offset="1" stop-color="#9AA8B4"/></linearGradient>
    <linearGradient id="g-table" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#D7A86F"/><stop offset=".12" stop-color="#C99A62"/><stop offset="1" stop-color="#A57745"/></linearGradient>
    <linearGradient id="g-wall" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#F4F9FC"/><stop offset="1" stop-color="#DCEAF3"/></linearGradient>
    <linearGradient id="g-case" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#7B4A26"/><stop offset="1" stop-color="#4E2C14"/></linearGradient>
    <linearGradient id="g-glass" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset=".12" stop-color="#E6F3F9" stop-opacity=".55"/><stop offset=".85" stop-color="#E6F3F9" stop-opacity=".35"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".9"/></linearGradient>
    <linearGradient id="g-water" x1="0" x2="1"><stop offset="0" stop-color="#2E9FD6" stop-opacity=".55"/><stop offset=".5" stop-color="#5CC4EE" stop-opacity=".45"/><stop offset="1" stop-color="#2E9FD6" stop-opacity=".55"/></linearGradient>
    <linearGradient id="g-ruler" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FFF6D6"/><stop offset="1" stop-color="#F1DD9C"/></linearGradient>
    <filter id="f-shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0B2233" flood-opacity=".25"/></filter>
  </defs>`;

  // ── Гири ──
  const GRAM = { 100: [30, 46], 50: [25, 38], 20: [20, 30], 10: [17, 25], 5: [14, 21], 2: [11.5, 17], 1: [10, 14] };
  function weight(w) {
    if (w.mg) {
      const W = 22, H = 4;
      return `<g><path d="M${-W / 2} 0h${W}v${-H}h${-W + 5}l-5 -5z" fill="url(#g-al)" stroke="#6E7C88" stroke-width=".8"/>
        <text x="1" y="-0.5" font-size="7.5" font-weight="700" fill="#33414D" text-anchor="middle" font-family="var(--mono)">${w.mg}</text></g>`;
    }
    const [W, H] = GRAM[w.mass];
    const neck = W * 0.34, knobW = W * 0.52, bodyH = H * 0.72;
    return `<g>
      <rect x="${-W / 2}" y="${-bodyH}" width="${W}" height="${bodyH}" rx="${W * 0.14}" fill="url(#g-brass)" stroke="#6B4E10" stroke-width=".8"/>
      <rect x="${-W / 2 + 1}" y="${-bodyH + 2}" width="${W * 0.18}" height="${bodyH - 4}" rx="2" fill="#FFF3C8" opacity=".55"/>
      <rect x="${-neck / 2}" y="${-H + (H - bodyH) * 0.55}" width="${neck}" height="${(H - bodyH) * 0.5}" fill="url(#g-brass)" stroke="#6B4E10" stroke-width=".6"/>
      <rect x="${-knobW / 2}" y="${-H}" width="${knobW}" height="${(H - bodyH) * 0.55}" rx="${knobW * 0.3}" fill="url(#g-brass-top)" stroke="#6B4E10" stroke-width=".6"/>
      <text x="0" y="${-bodyH / 2 + 3.5}" font-size="${Math.max(7, W * 0.36)}" font-weight="800" fill="#4A3305" text-anchor="middle" font-family="var(--mono)">${w.mass}</text>
    </g>`;
  }
  const weightSize = (w) => (w.mg ? [22, 9] : GRAM[w.mass]);

  // ── Тела ──
  const MAT = {
    al: { fill: "url(#g-al)", stroke: "#6F7E8A", text: "#33424F" },
    steel: { fill: "url(#g-steel)", stroke: "#2C3741", text: "#F3F6F8" },
    wood: { fill: "url(#g-wood)", stroke: "#8A5A26", text: "#4D2E0C" },
    nugget: { fill: "url(#g-gold)", stroke: "#7A560C", text: "#3E2B05" },
  };
  // view: "front" — длина × высота, "side" — ширина × высота
  function body(b, s, { view = "front", label = true } = {}) {
    const m = MAT[b.skin];
    const drops = b.wet ? [[-0.3, -0.35], [0.25, -0.6], [0.05, -0.15]].map(([dx, dy]) => `<path d="M${r1(dx * bw(b, s, view))} ${r1(dy * bh(b, s))}q3 5 0 7q-3 -2 0 -7z" fill="#3FB6E8" stroke="#1E8FC6" stroke-width=".6"/>`).join("") : "";
    if (b.shape === "nugget") {
      const W = 2.6 * s, H = 2.1 * s;
      const pts = [[-0.5, 0], [-0.46, -0.45], [-0.3, -0.78], [-0.05, -1], [0.22, -0.9], [0.44, -0.62], [0.5, -0.25], [0.38, 0]].map(([x, y]) => `${r1(x * W)},${r1(y * H)}`).join(" ");
      const facets = `<path d="M${r1(-0.3 * W)} ${r1(-0.78 * H)}L${r1(0.05 * W)} ${r1(-0.5 * H)}L${r1(0.44 * W)} ${r1(-0.62 * H)}M${r1(0.05 * W)} ${r1(-0.5 * H)}L${r1(0 * W)} 0M${r1(-0.46 * W)} ${r1(-0.45 * H)}L${r1(0.05 * W)} ${r1(-0.5 * H)}" stroke="#FFF6C8" stroke-width="1" opacity=".7" fill="none"/>`;
      return `<g><polygon points="${pts}" fill="${m.fill}" stroke="${m.stroke}" stroke-width="1.2"/>${facets}${label ? badge(b.n, -0.32 * W, -0.62 * H, s) : ""}${drops}</g>`;
    }
    const W = (view === "side" ? b.a : b.l) * s, H = b.h * s;
    const grain = b.skin === "wood" ? [0.25, 0.5, 0.75].map((k) => `<path d="M${r1(-W / 2 + 2)} ${r1(-H * k)}q${r1(W / 4)} ${r1(-H * 0.08)} ${r1(W / 2)} 0t${r1(W / 2 - 4)} 0" stroke="#A8743C" stroke-width=".9" fill="none" opacity=".7"/>`).join("") : "";
    const shine = b.skin !== "wood" ? `<rect x="${r1(-W / 2 + 2)}" y="${r1(-H + 2)}" width="${r1(W - 4)}" height="${r1(Math.min(4, H * 0.18))}" rx="2" fill="#fff" opacity=".45"/>` : "";
    const tag = label && W > 26 ? `<text x="${r1(W / 2 - 4)}" y="${r1(-H / 2 + 3.5)}" font-size="${Math.min(11, H * 0.45)}" font-weight="800" text-anchor="end" fill="${m.text}" font-family="var(--font)">${b.sym}</text>` : "";
    return `<g><rect x="${r1(-W / 2)}" y="${r1(-H)}" width="${r1(W)}" height="${r1(H)}" rx="2" fill="${m.fill}" stroke="${m.stroke}" stroke-width="1.2"/>${grain}${shine}${tag}${label ? badge(b.n, -W / 2 + 7, -H + 7, s) : ""}${drops}</g>`;
  }
  const bw = (b, s, view) => (b.shape === "nugget" ? 2.6 : view === "side" ? b.a : b.l) * s;
  const bh = (b, s) => (b.shape === "nugget" ? 2.1 : b.h) * s;
  const badge = (n, x, y, s) => (s < 9 ? "" : `<g><circle cx="${r1(x)}" cy="${r1(y)}" r="6.5" fill="#14324A"/><text x="${r1(x)}" y="${r1(y + 3.3)}" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" font-family="var(--font)">${n}</text></g>`);

  // ── Весы ── Всё строится от оси коромысла; шкала — дуга окружности с центром в оси.
  const B = { px: 520, py: 168, arm: 228, hang: 238, ptr: 292, arcR: 292, deg: 12, base: 556 };
  function balanceStatic() {
    const { px, py, base } = B;
    const arc = arcScale(px, py, B.arcR, B.deg, { big: false });
    return `<g filter="url(#f-shadow)">
      <path d="M${px - 78} ${base}l14 -26h128l14 26z" fill="url(#g-col)" stroke="#132A3C" stroke-width="1.2"/>
      <rect x="${px - 92}" y="${base - 2}" width="184" height="8" rx="3" fill="#1C3448"/>
      <circle cx="${px - 70}" cy="${base + 3}" r="5" fill="#0F2233"/><circle cx="${px + 70}" cy="${base + 3}" r="5" fill="#0F2233"/>
      <rect x="${px - 8}" y="${py + 6}" width="16" height="${base - py - 32}" rx="5" fill="url(#g-col)" stroke="#132A3C" stroke-width="1"/>
      <rect x="${px - 54}" y="${py + B.arcR - 26}" width="108" height="40" rx="10" fill="#F7FBFE" stroke="#1C3448" stroke-width="1.4"/>
      ${arc}
      <text x="${px}" y="${base - 34}" text-anchor="middle" font-size="9" font-weight="700" fill="#BFD3E3" font-family="var(--font)">200 г</text>
    </g>`;
  }
  // Дуга шкалы: деления через 1°, длинные через 5°. Одна и та же функция рисует шкалу на весах и в лупе.
  function arcScale(cx, cy, R, deg, { big }) {
    const ticks = [];
    for (let d = -deg; d <= deg; d++) {
      const a = (d * Math.PI) / 180;
      const len = d === 0 ? (big ? 26 : 13) : d % 5 === 0 ? (big ? 20 : 10) : big ? 12 : 6;
      const x1 = cx + R * Math.sin(a), y1 = cy + R * Math.cos(a);
      const x2 = cx + (R + len) * Math.sin(a), y2 = cy + (R + len) * Math.cos(a);
      ticks.push(`<line x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(x2)}" y2="${r1(y2)}" stroke="#14324A" stroke-width="${d === 0 ? (big ? 3 : 2) : d % 5 === 0 ? (big ? 2.2 : 1.4) : big ? 1.4 : 0.9}" stroke-linecap="round"/>`);
    }
    const a0 = (-deg * Math.PI) / 180, a1 = (deg * Math.PI) / 180;
    const p = (a, r) => `${r1(cx + r * Math.sin(a))} ${r1(cy + r * Math.cos(a))}`;
    const line = `<path d="M${p(a0, R)}A${R} ${R} 0 0 0 ${p(a1, R)}" fill="none" stroke="#14324A" stroke-width="${big ? 2 : 1.2}"/>`;
    const lab = big ? [-10, -5, 0, 5, 10].map((d) => { const a = (d * Math.PI) / 180; return `<text x="${r1(cx + (R + 40) * Math.sin(a))}" y="${r1(cy + (R + 40) * Math.cos(a) + 6)}" font-size="17" font-weight="700" text-anchor="middle" fill="#14324A" font-family="var(--mono)">${Math.abs(d)}</text>`; }).join("") : "";
    return line + ticks.join("") + lab;
  }
  // Коромысло со стрелкой — поворачивается целиком вокруг оси.
  function beam() {
    const { px, py, arm } = B;
    const ends = [-1, 1].map((s) => `<g><rect x="${px + s * arm - 9}" y="${py - 9}" width="18" height="12" rx="3" fill="#1F3D55"/><path d="M${px + s * arm - 5} ${py + 3}l5 8l5 -8z" fill="#E0B04A" stroke="#6B4E10" stroke-width=".8"/>
      <rect x="${px + s * (arm - 34) - 6}" y="${py - 8}" width="12" height="16" rx="3" fill="url(#g-brass)" stroke="#6B4E10" stroke-width=".7"/></g>`).join("");
    return `<g>
      <line x1="${px}" y1="${py}" x2="${px}" y2="${py + B.ptr}" stroke="#FF5B00" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M${px - 4} ${py + B.ptr - 16}L${px} ${py + B.ptr + 4}L${px + 4} ${py + B.ptr - 16}z" fill="#FF5B00"/>
      <path d="M${px - arm} ${py - 4}Q${px} ${py - 22} ${px + arm} ${py - 4}L${px + arm} ${py + 4}Q${px} ${py - 6} ${px - arm} ${py + 4}z" fill="url(#g-beam)" stroke="#132A3C" stroke-width="1.2"/>
      ${ends}
      <circle cx="${px}" cy="${py}" r="11" fill="url(#g-brass)" stroke="#6B4E10" stroke-width="1"/><circle cx="${px}" cy="${py}" r="3.5" fill="#4A3305"/>
    </g>`;
  }
  // Чаша на подвесе: (0,0) — точка подвеса на конце коромысла.
  function pan(strips) {
    const H = B.hang, W = 172;
    const paper = Array.from({ length: strips }, (_, i) => `<rect x="${-40 + i * 6}" y="${H - 12 - i * 1.6}" width="80" height="2.2" fill="#FFFFFF" stroke="#C9D2DA" stroke-width=".6" transform="rotate(${(i % 2 ? -3 : 2)} 0 ${H - 12})"/>`).join("");
    return `<g>
      <path d="M0 6V22M-5 22h10" stroke="#1F3D55" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M0 22L${-W / 2 + 6} ${H - 10}M0 22L${W / 2 - 6} ${H - 10}" stroke="#4E6A80" stroke-width="1.6"/>
      <path d="M${-W / 2} ${H - 10}Q0 ${H + 22} ${W / 2} ${H - 10}z" fill="url(#g-pan)" stroke="#3C5466" stroke-width="1.4"/>
      <ellipse cx="0" cy="${H - 10}" rx="${W / 2}" ry="5" fill="#F4F7F9" stroke="#3C5466" stroke-width="1.2"/>
      ${paper}
    </g>`;
  }
  const panSurface = () => B.hang - 12; // где лежат предметы относительно точки подвеса

  // ── Футляр с разновесом и лоток ──
  function weightCase(x, y, w, h, holes) {
    const slots = holes.map((s) => `<ellipse cx="${s.x}" cy="${s.y + 1}" rx="${s.w / 2 + 4}" ry="4" fill="#2A1608" opacity=".8"/><text x="${s.x}" y="${y + h - 6}" font-size="10" font-weight="700" text-anchor="middle" fill="#F6E3C8" font-family="var(--mono)">${s.label}</text>`).join("");
    return `<g filter="url(#f-shadow)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="url(#g-case)" stroke="#2E180A" stroke-width="1.4"/>
      <rect x="${x + 8}" y="${y + 8}" width="${w - 16}" height="${h - 16}" rx="7" fill="#8E1F2B" opacity=".55"/>${slots}
      <text x="${x + 12}" y="${y - 6}" font-size="12" font-weight="800" fill="#14324A" font-family="var(--font)">Разновес</text></g>`;
  }
  function tray(x, y, w, h, title = "Лоток с телами") {
    return `<g filter="url(#f-shadow)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="#E9EEF2" stroke="#8496A5" stroke-width="1.4"/><rect x="${x + 6}" y="${y + 4}" width="${w - 12}" height="4" rx="2" fill="#fff" opacity=".8"/>
      <text x="${x + 10}" y="${y - 8}" font-size="12" font-weight="800" fill="#14324A" font-family="var(--font)">${title}</text></g>`;
  }
  const room = (W, H, tableY) => `<rect x="-3000" y="-3000" width="${W + 6000}" height="${tableY + 3000}" fill="#EAF3F9"/><rect x="-3000" y="${tableY}" width="${W + 6000}" height="${H - tableY + 3000}" fill="url(#g-table)"/><rect x="-3000" y="${tableY}" width="${W + 6000}" height="3" fill="#E8C18E"/>`;

  // ── Мензурка: 100 мл, деления по 2 мл, подписи через 10 мл ──
  const C = { cx: 540, top: 70, bottom: 540, inW: 132, zero: 532, pxml: 4.35 };
  const levelY = (v) => C.zero - v * C.pxml;
  function cylinder(level, bodyHtml) {
    const { cx, top, bottom, inW } = C;
    const x0 = cx - inW / 2, x1 = cx + inW / 2;
    const ticks = [];
    for (let v = 0; v <= 100; v += 2) {
      const y = levelY(v), big = v % 10 === 0;
      ticks.push(`<line x1="${x0}" y1="${r1(y)}" x2="${x0 + (big ? 26 : 14)}" y2="${r1(y)}" stroke="#14324A" stroke-width="${big ? 1.8 : 1}"/>`);
      if (big && v > 0) ticks.push(`<text x="${x0 + 30}" y="${r1(y + 5)}" font-size="14" font-weight="700" fill="#14324A" font-family="var(--mono)">${v}</text>`);
    }
    const ly = levelY(level);
    const water = `<path d="M${x0} ${r1(ly)}H${x1}V${bottom - 8}H${x0}z" fill="url(#g-water)"/>
      <path d="M${x0} ${r1(ly)}H${x1}" fill="none" stroke="#1E8FC6" stroke-width="2"/>`;
    return `<g>
      <path d="M${cx - 92} ${bottom + 8}h184l-10 -18h-164z" fill="url(#g-col)" stroke="#132A3C" stroke-width="1.2"/>
      <rect x="${x0 - 6}" y="${top}" width="${inW + 12}" height="${bottom - top}" rx="8" fill="#F6FBFE" opacity=".7"/>
      ${water}
      <g>${bodyHtml}</g>
      <g pointer-events="none"><rect x="${x0 - 6}" y="${top}" width="${inW + 12}" height="${bottom - top}" rx="8" fill="url(#g-glass)" stroke="#7FA6BF" stroke-width="2"/>
      <path d="M${x0 - 6} ${top + 4}q-10 -10 -16 -12" stroke="#7FA6BF" stroke-width="2" fill="none"/>
      ${ticks.join("")}
      <text x="${x1 - 8}" y="${top + 22}" font-size="14" font-weight="800" text-anchor="end" fill="#14324A" font-family="var(--font)">мл</text></g>
    </g>`;
  }

  // ── Уголок с двумя шкалами: ноль в углу, горизонтальная шкала 0…8 см вправо, вертикальная 0…5 см вверх ──
  function square(s) {
    const HL = 8.4, VL = 5.4, T = 34;
    const t = [];
    for (let mm = 0; mm <= HL * 10; mm++) {
      const x = (mm / 10) * s, big = mm % 10 === 0, mid = mm % 5 === 0;
      t.push(`<line x1="${r1(x)}" y1="0" x2="${r1(x)}" y2="${big ? 16 : mid ? 11 : 6}" stroke="#222" stroke-width="${big ? 1.3 : 0.7}"/>`);
      if (big) t.push(`<text x="${r1(x)}" y="28" font-size="11" font-weight="700" text-anchor="middle" fill="#222" font-family="var(--mono)">${mm / 10}</text>`);
    }
    for (let mm = 1; mm <= VL * 10; mm++) {
      const y = -(mm / 10) * s, big = mm % 10 === 0, mid = mm % 5 === 0;
      t.push(`<line x1="0" y1="${r1(y)}" x2="${big ? -16 : mid ? -11 : -6}" y2="${r1(y)}" stroke="#222" stroke-width="${big ? 1.3 : 0.7}"/>`);
      if (big) t.push(`<text x="-20" y="${r1(y + 4)}" font-size="11" font-weight="700" text-anchor="end" fill="#222" font-family="var(--mono)">${mm / 10}</text>`);
    }
    return `<g filter="url(#f-shadow)" style="cursor:grab">
      <path d="M${-T} ${-VL * s - 10}H0V0H${HL * s + 10}V${T}H${-T}Z" fill="url(#g-ruler)" stroke="#B89B4C" stroke-width="1.2" opacity=".96"/>
      ${t.join("")}<circle cx="0" cy="0" r="3" fill="#FF5B00"/>
      <text x="${HL * s - 4}" y="${T - 6}" font-size="10" text-anchor="end" fill="#555" font-family="var(--font)">см</text></g>`;
  }

  // ── Линейка: 0…len см, миллиметры ──
  function ruler(x, y, len, s, vertical = false) {
    const ticks = [];
    for (let mm = 0; mm <= len * 10; mm++) {
      const d = (mm / 10) * s, big = mm % 10 === 0, mid = mm % 5 === 0;
      const L = big ? 18 : mid ? 12 : 7;
      ticks.push(vertical ? `<line x1="${x}" y1="${r1(y - d)}" x2="${x + L}" y2="${r1(y - d)}" stroke="#2B2B2B" stroke-width="${big ? 1.4 : 0.8}"/>` : `<line x1="${r1(x + d)}" y1="${y}" x2="${r1(x + d)}" y2="${y + L}" stroke="#2B2B2B" stroke-width="${big ? 1.4 : 0.8}"/>`);
      if (big) ticks.push(vertical ? `<text x="${x + 22}" y="${r1(y - d + 5)}" font-size="13" font-weight="700" fill="#2B2B2B" font-family="var(--mono)">${mm / 10}</text>` : `<text x="${r1(x + d)}" y="${y + 33}" font-size="13" font-weight="700" text-anchor="middle" fill="#2B2B2B" font-family="var(--mono)">${mm / 10}</text>`);
    }
    const body = vertical ? `<rect x="${x - 2}" y="${y - len * s - 14}" width="54" height="${len * s + 28}" rx="4" fill="url(#g-ruler)" stroke="#B89B4C" stroke-width="1.2"/>` : `<rect x="${x - 14}" y="${y - 2}" width="${len * s + 28}" height="46" rx="4" fill="url(#g-ruler)" stroke="#B89B4C" stroke-width="1.2"/>`;
    const unit = vertical ? `<text x="${x + 22}" y="${y + 12}" font-size="11" fill="#2B2B2B" font-family="var(--font)">см</text>` : `<text x="${x + len * s + 6}" y="${y + 33}" font-size="11" fill="#2B2B2B" font-family="var(--font)">см</text>`;
    return `<g filter="url(#f-shadow)">${body}${ticks.join("")}${unit}</g>`;
  }

  // ── Чертежи для тетради: чёрные линии, как в экзаменационных заданиях ──
  function schemeBalance() {
    return `<svg viewBox="0 0 320 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Схема: рычажные весы, тело на левой чаше, гири на правой">
      <g fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M120 176h80M140 176l8 -14h24l8 14M160 162V44M60 40h200"/><circle cx="160" cy="40" r="4" fill="#111"/>
        <path d="M60 40v14M60 54l-34 74M60 54l34 74M20 128h80q-40 22 -80 0"/><path d="M260 40v14M260 54l-34 74M260 54l34 74M220 128h80q-40 22 -80 0"/>
        <path d="M160 40v104"/><path d="M140 150a24 24 0 0 0 40 0"/>
        <rect x="40" y="104" width="40" height="24"/>
        <path d="M232 128v-18h12v18M250 128v-12h9v12M264 128v-8h7v8"/>
      </g>
      <text x="60" y="186" font-size="12" text-anchor="middle" font-family="var(--font)">тело</text><text x="260" y="186" font-size="12" text-anchor="middle" font-family="var(--font)">гири</text>
    </svg>`;
  }
  function schemeCylinder() {
    return `<svg viewBox="0 0 320 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Схема: две мензурки, уровень воды V1 без тела и V2 с телом на нити">
      <g fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round">
        <path d="M50 20v150h50V20M40 176h70"/><path d="M50 100h50" stroke-dasharray="5 4"/>
        <path d="M200 20v150h50V20M190 176h70"/><path d="M200 78h50" stroke-dasharray="5 4"/><path d="M225 10v120"/><rect x="214" y="130" width="22" height="34"/>
        ${[40, 60, 80, 100, 120, 140].map((y) => `<path d="M50 ${y}h8M200 ${y}h8"/>`).join("")}
      </g>
      <text x="108" y="104" font-size="13" font-family="var(--font)">V₁</text><text x="258" y="82" font-size="13" font-family="var(--font)">V₂</text>
      <text x="75" y="188" font-size="11" text-anchor="middle" font-family="var(--font)">без тела</text><text x="225" y="188" font-size="11" text-anchor="middle" font-family="var(--font)">тело в воде</text>
    </svg>`;
  }
  // Карточки прогноза в стиле экзаменационных рисунков
  function card(items) {
    const n = items.length, W = 300, H = 120;
    const out = items.map((it, i) => {
      const cx = ((i + 0.5) * W) / n;
      const w = it.w, h = it.h;
      return `<rect x="${r1(cx - w / 2)}" y="${86 - h}" width="${w}" height="${h}" fill="#fff" stroke="#111" stroke-width="2"/>
        <text x="${r1(cx)}" y="${80 - h / 2 + 5}" font-size="13" font-weight="700" text-anchor="middle" font-family="var(--font)">${it.sym}</text>
        <text x="${r1(cx)}" y="104" font-size="12" text-anchor="middle" font-family="var(--font)">${it.name}</text>
        <text x="${r1(cx)}" y="118" font-size="12" text-anchor="middle" font-family="var(--mono)">${it.v}</text>`;
    }).join("");
    return `<svg viewBox="0 0 ${W} ${H + 4}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${items.map((i) => i.name + " " + i.v).join(", ")}"><path d="M10 86h280" stroke="#111" stroke-width="1"/>${out}</svg>`;
  }

  return { defs, weight, weightSize, body, bw, bh, B, balanceStatic, arcScale, beam, pan, panSurface, weightCase, tray, room, C, levelY, cylinder, ruler, schemeBalance, schemeCylinder, card, square, r1 };
})();

// Сцена: данные, состояние, приборы на отдельных экранах, перетаскивание и физика весов.
// Сообщения и кнопки выбора — поверх сцены: раскладка не прыгает, когда они появляются.
const LAB = (() => {
  const $ = (s, r = document) => r.querySelector(s);

  // ── Данные. Размеры не круглые: линейкой и мензуркой ученик получит чуть разные объёмы. ──
  const brick = (id, n, name, short, sym, skin, l, a, h, rho, mat, extra = {}) => {
    const V = Math.round(l * a * h * 100) / 100;
    return { id, n, name, short, sym, skin, shape: "brick", l, a, h, V, m: Math.round(rho * V * 10) / 10, rho, mat, ...extra };
  };
  const BODIES = [
    brick("b1", 1, "Алюминиевый брусок малый", "Al, малый", "Al", "al", 4.8, 2.1, 2.0, 2.7, "Алюминий"),
    brick("b2", 2, "Алюминиевый брусок большой", "Al, большой", "Al", "al", 6.2, 2.4, 2.0, 2.7, "Алюминий"),
    brick("b3", 3, "Стальной брусок", "сталь", "сталь", "steel", 4.8, 2.1, 2.0, 7.8, "Сталь"),
    brick("b4", 4, "Деревянный брусок (сосна)", "сосна", "сосна", "wood", 4.8, 2.1, 2.0, 0.5, "Сосна", { floats: true }),
    { id: "b5", n: 5, name: "Самородок", short: "самородок", sym: "?", skin: "nugget", shape: "nugget", V: 10.4, m: 52.0, rho: 5.0, mat: "Пирит" },
  ];
  const WEIGHTS = [100, 50, 20, 20, 10, 5, 2, 2, 1].map((g, i) => ({ id: `g${i}`, mass: g, label: `${g} г` }))
    .concat([500, 200, 200, 100].map((mg, i) => ({ id: `mg${i}`, mass: mg / 1000, mg, label: `${mg} мг` })));
  const V1 = 46, STRIP = 0.2, TARE = -0.4, MAXLOAD = 200, TMAX = (10 * Math.PI) / 180;
  const byId = (id) => BODIES.find((b) => b.id === id) || WEIGHTS.find((w) => w.id === id);
  const isBody = (id) => id.startsWith("b");
  const SQUARE0 = { x: 640, y: 430 };

  const st = {
    screen: "scales", place: {}, wet: new Set(), strips: { L: 0, R: 0 },
    tilt: 0, rate: 0, level: V1, selected: null, ruler: { body: "b1" }, square: { ...SQUARE0 },
    listeners: [], log: [], softCount: 0, lastBalanced: "",
  };
  BODIES.forEach((b) => (st.place[b.id] = "tray"));
  WEIGHTS.forEach((w) => (st.place[w.id] = "box"));
  const on = (fn) => st.listeners.push(fn);
  const emit = (type, data = {}) => { st.log.push({ type, ...data, t: Date.now() }); st.listeners.forEach((fn) => fn(type, data)); };
  const kori = (behavior, text) => emit("kori", { behavior, text });
  const inPlace = (p) => Object.keys(st.place).filter((id) => st.place[id] === p);
  const load = (p) => inPlace(p).reduce((s, id) => s + (isBody(id) ? byId(id).m : byId(id).mass), 0);
  const cylBodies = () => inPlace("cyl");
  const levelTarget = () => V1 + cylBodies().reduce((s, id) => s + byId(id).V, 0);

  // Всплывающее сообщение поверх сцены: место под него не резервируется, раскладка не двигается.
  let toastTimer = 0;
  function say(text, kind = "") {
    const el = $("#toast"); if (!el) return;
    clearTimeout(toastTimer);
    el.textContent = text; el.dataset.kind = kind; el.hidden = !text;
    if (text) toastTimer = setTimeout(() => { el.hidden = true; }, kind === "env" ? 7000 : 4500);
  }

  // ── Правила среды: только физически невозможное. Нарушение правил взвешивания не запрещаем — Кори удивляется. ──
  function move(id, to) {
    const from = st.place[id];
    if (from === to) { st.selected = null; render(); return false; }
    const body = isBody(id) ? byId(id) : null;
    if (to === "L" || to === "R") {
      if (body && st.wet.has(id)) { say("Мокрое тело на весы не кладут: вытри его тряпочкой.", "env"); emit("rule", { rule: "wet", id }); kori("wrong_again", "Загляни в правила"); return false; }
      const add = body ? body.m : byId(id).mass;
      if (load(to) + add > MAXLOAD) { say(`Перегруз: на чашу этих весов можно положить не больше ${MAXLOAD} г.`, "env"); emit("rule", { rule: "overload", id }); kori("oops", "Ой!"); return false; }
    }
    if (to === "cyl") {
      if (!body) return false;
      if (body.floats) { say("Сосна легче воды и всплывает — так объём не измерить. Измерь её линейкой.", "env"); emit("rule", { rule: "floats", id }); kori("wrong", "Хм… всплывает"); return false; }
      if (cylBodies().length) { say("В мензурке уже есть тело. Вынь его, потом опусти следующее.", "env"); return false; }
    }
    if ((to === "box" && body) || (to === "tray" && !body)) return false;
    st.place[id] = to;
    st.selected = null;
    if (from === "cyl") { st.wet.add(id); say(`${body.name} мокрое. Прежде чем взвешивать, вытри его.`); }
    else say("");
    emit("move", { id, from, to });
    if ((body && to === "R") || (!body && to === "L")) { st.softCount++; emit("soft", { id, to }); kori(st.softCount >= 3 ? "wrong_support" : "wrong", "Проверь ещё раз!"); }
    render(); kick();
    return true;
  }
  function dry() { if (!st.wet.size) { say("Все тела сухие."); return; } st.wet.clear(); say("Тела вытерты."); emit("dry"); render(); }
  function clearWeights() { WEIGHTS.forEach((w) => (st.place[w.id] = "box")); say("Гири убраны в футляр."); emit("clearWeights"); render(); kick(); }
  // Сброс работает только на текущем приборе: полоски на весах остаются.
  function resetScreen() {
    if (st.screen === "scales") { WEIGHTS.forEach((w) => (st.place[w.id] = "box")); BODIES.forEach((b) => { if (st.place[b.id] === "L" || st.place[b.id] === "R") st.place[b.id] = "tray"; }); say("Чаши пусты: гири в футляре, тела в лотке. Полоски бумаги остались."); }
    else if (st.screen === "cyl") { BODIES.forEach((b) => { if (st.place[b.id] === "cyl") st.place[b.id] = "tray"; }); st.wet.clear(); say("Мензурка пустая, тела сухие."); }
    else if (st.screen === "ruler") { st.square = { ...SQUARE0 }; say("Уголок на месте."); }
    st.selected = null;
    emit("reset", { screen: st.screen }); render(); kick();
  }
  function strip(side, d) { st.strips[side] = Math.max(0, Math.min(8, st.strips[side] + d)); emit("strip", { side, d }); render(); kick(); }

  // ── Отрисовка ──
  const W = 1000, H = 620;
  const svg = () => $("#scene-svg");
  const r1 = ART.r1;
  function itemG(id, x, y, html) {
    const o = byId(id);
    const label = isBody(id) ? `${o.n}. ${o.name}${st.wet.has(id) ? ", мокрое" : ""}` : `Гиря ${o.label}`;
    return `<g class="item${st.selected === id ? " sel" : ""}" data-id="${id}" transform="translate(${r1(x)} ${r1(y)})" tabindex="0" role="button" aria-label="${label}"><title>${label}</title>${html}</g>`;
  }
  function rows(ids, maxW, size, gap = 5) {
    const out = []; let row = [], w = 0, y = 0, rowH = 0;
    const flush = () => { let x = -w / 2; row.forEach(([id, iw]) => { out.push([id, x + iw / 2, y]); x += iw + gap; }); y -= rowH + 2; row = []; w = 0; rowH = 0; };
    ids.forEach((id) => { const [iw, ih] = size(id); if (row.length && w + iw > maxW) flush(); row.push([id, iw, ih]); w += (row.length > 1 ? gap : 0) + iw; rowH = Math.max(rowH, ih); });
    if (row.length) flush();
    return out;
  }
  const S_SCALE = 12;
  const sizeOf = (id) => (isBody(id) ? [ART.bw(byId(id), S_SCALE, "front"), ART.bh(byId(id), S_SCALE)] : ART.weightSize(byId(id)));
  const itemArt = (id) => (isBody(id) ? ART.body({ ...byId(id), wet: st.wet.has(id) }, S_SCALE) : ART.weight(byId(id)));
  const CASE = { x: 640, y: 466, w: 340, h: 90 };
  const HOLES = (() => {
    const out = []; let x = CASE.x + 22;
    WEIGHTS.filter((w) => !w.mg).forEach((w) => { const [iw] = ART.weightSize(w); out.push({ id: w.id, x: x + iw / 2, y: CASE.y + 62, w: iw, label: w.mass }); x += iw + 9; });
    WEIGHTS.filter((w) => w.mg).forEach((w, i) => out.push({ id: w.id, x: CASE.x + 278 + (i % 2) * 34, y: CASE.y + 30 + Math.floor(i / 2) * 26, w: 22, label: "" }));
    return out;
  })();
  const TRAY = { x: 20, y: 500, w: 352, h: 56 };
  const trayZone = `<rect class="zone" data-zone="tray" x="${TRAY.x - 6}" y="${TRAY.y - 70}" width="${TRAY.w + 12}" height="${TRAY.h + 76}" rx="12"/>`;
  function trayItems() {
    const slotX = (b) => TRAY.x + 44 + (b.n - 1) * 66;
    return inPlace("tray").map((id) => itemG(id, slotX(byId(id)), TRAY.y + 50, ART.body({ ...byId(id), wet: st.wet.has(id) }, S_SCALE))).join("");
  }
  function panPoints() {
    const B = ART.B, c = Math.cos(st.tilt), s = Math.sin(st.tilt);
    return { L: { x: B.px - B.arm * c, y: B.py + B.arm * s }, R: { x: B.px + B.arm * c, y: B.py - B.arm * s } };
  }
  function renderScales() {
    const B = ART.B, p = panPoints();
    const panG = (side) => {
      const items = rows(inPlace(side), 150, sizeOf).map(([id, x, y]) => itemG(id, x, ART.panSurface() + y, itemArt(id))).join("");
      return `<g id="pan-${side}" transform="translate(${r1(p[side].x)} ${r1(p[side].y)})">${ART.pan(st.strips[side])}${items}<rect class="zone" data-zone="${side}" x="-100" y="${B.hang - 170}" width="200" height="190" rx="14"/></g>`;
    };
    const boxItems = inPlace("box").map((id) => { const h = HOLES.find((x) => x.id === id); return itemG(id, h.x, h.y, ART.weight(byId(id))); }).join("");
    svg().innerHTML = `${ART.defs}${ART.room(W, H, 556)}
      ${ART.tray(TRAY.x, TRAY.y, TRAY.w, TRAY.h)}${trayZone}
      ${ART.weightCase(CASE.x, CASE.y, CASE.w, CASE.h, HOLES)}<rect class="zone" data-zone="box" x="${CASE.x - 6}" y="${CASE.y - 24}" width="${CASE.w + 12}" height="${CASE.h + 30}" rx="12"/>
      ${ART.balanceStatic()}
      <g id="beam" transform="rotate(${r1((-st.tilt * 18000) / Math.PI) / 100} ${B.px} ${B.py})">${ART.beam()}</g>
      ${panG("L")}${panG("R")}
      <g>${trayItems()}</g><g>${boxItems}</g><g id="drag"></g>`;
    wireItems();
  }
  const C_SCALE = 40;
  function renderCylinder() {
    const C = ART.C;
    const inside = cylBodies().map((id) => {
      const b = byId(id);
      const up = b.shape === "brick" ? { ...b, l: b.a, h: b.l, wet: false } : { ...b, wet: false };
      const bh = ART.bh(up, C_SCALE);
      return `<line x1="${C.cx}" y1="${C.top - 20}" x2="${C.cx}" y2="${C.bottom - 8 - bh}" stroke="#4A4A4A" stroke-width="1.3" pointer-events="none"/>` + itemG(id, C.cx, C.bottom - 8, ART.body(up, C_SCALE));
    }).join("");
    svg().innerHTML = `${ART.defs}${ART.room(W, H, 556)}
      ${ART.tray(TRAY.x, TRAY.y, TRAY.w, TRAY.h)}${trayZone}
      <rect class="zone" data-zone="cyl" x="${C.cx - 100}" y="${C.top - 10}" width="200" height="${C.bottom - C.top + 20}" rx="14"/>
      <g id="cyl">${ART.cylinder(st.level, inside)}</g>
      <g>${trayItems()}</g><g id="drag"></g>`;
    wireItems();
  }

  // Линейка: брусок в трёх видах сразу (спереди, сбоку, сверху) и уголок с двумя шкалами, который ученик двигает сам.
  const RS = 40;
  function renderRuler() {
    const b = byId(st.ruler.body);
    let art = "";
    if (b.shape !== "brick") {
      art = `<text x="500" y="230" font-size="22" font-weight="700" text-anchor="middle" fill="#14324A" font-family="var(--font)">${b.name}: неправильная форма.</text><text x="500" y="264" font-size="18" text-anchor="middle" fill="#3F5F78" font-family="var(--font)">Линейкой его объём не найти — измерь погружением в мензурке.</text>`;
    } else {
      const FX = 110, FY = 250, SX = FX + b.l * RS + 90, TY = FY + 70;
      const cap = (x, y, t) => `<text x="${x}" y="${y}" font-size="15" font-weight="700" fill="#14324A" font-family="var(--font)">${t}</text>`;
      art = `<text x="${FX}" y="56" font-size="19" font-weight="800" fill="#14324A" font-family="var(--font)">${b.n}. ${b.name}</text>
        ${cap(FX, FY - b.h * RS - 14, "Вид спереди")}<g transform="translate(${FX + (b.l * RS) / 2} ${FY})">${ART.body({ ...b, wet: false }, RS, { view: "front" })}</g>
        ${cap(SX, FY - b.h * RS - 14, "Вид сбоку")}<g transform="translate(${SX + (b.a * RS) / 2} ${FY})">${ART.body({ ...b, wet: false }, RS, { view: "side", label: false })}</g>
        ${cap(FX, TY - 10, "Вид сверху")}<g transform="translate(${FX + (b.l * RS) / 2} ${TY + b.a * RS})">${ART.body({ ...b, h: b.a, wet: false }, RS, { view: "front", label: false })}</g>`;
    }
    const sq = st.square;
    svg().innerHTML = `${ART.defs}${ART.room(W, H, 556)}${art}
      <g id="square" class="square" transform="translate(${r1(sq.x)} ${r1(sq.y)})" tabindex="0" role="slider" aria-label="Уголок с двумя шкалами: перетащи, стрелки — сдвиг на 1 мм">${ART.square(RS)}</g>
      ${ART.tray(TRAY.x, TRAY.y, TRAY.w, TRAY.h, "Лоток: нажми на брусок, чтобы измерить")}<g>${trayItems()}</g>`;
    svg().querySelectorAll(".item").forEach((g) => {
      const pick = () => { st.ruler.body = g.dataset.id; emit("ruler", { id: g.dataset.id }); render(); };
      g.addEventListener("click", pick);
      g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
    });
    const g = $("#square");
    let start = null;
    g.addEventListener("pointerdown", (ev) => { ev.preventDefault(); try { g.setPointerCapture(ev.pointerId); } catch (_) {} const p = point(ev); start = { x: p.x, y: p.y, sx: st.square.x, sy: st.square.y }; g.classList.add("dragging"); });
    g.addEventListener("pointermove", (ev) => { if (!start) return; const p = point(ev); st.square.x = Math.max(20, Math.min(W - 40, start.sx + p.x - start.x)); st.square.y = Math.max(240, Math.min(H - 20, start.sy + p.y - start.y)); g.setAttribute("transform", `translate(${r1(st.square.x)} ${r1(st.square.y)})`); });
    const end = () => { if (start) { start = null; g.classList.remove("dragging"); emit("square", { ...st.square }); } };
    g.addEventListener("pointerup", end); g.addEventListener("pointercancel", end);
    g.addEventListener("keydown", (e) => {
      const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key]; if (!d) return;
      e.preventDefault(); st.square.x += (d[0] * RS) / 10; st.square.y += (d[1] * RS) / 10; g.setAttribute("transform", `translate(${r1(st.square.x)} ${r1(st.square.y)})`);
    });
  }

  // ── Лупы ──
  function lupaScales() {
    const el = $("#lupa"); if (!el) return;
    const R = 292 * 3.1, cx = 150, cy = 150 - R - 8, t = st.tilt;
    const tipX = cx + (R + 6) * Math.sin(t), tipY = cy + (R + 6) * Math.cos(t);
    const baseX = cx + (R - 150) * Math.sin(t), baseY = cy + (R - 150) * Math.cos(t);
    el.innerHTML = `<svg viewBox="0 0 300 300" aria-hidden="true"><defs><clipPath id="lc"><circle cx="150" cy="150" r="140"/></clipPath></defs>
      <circle cx="150" cy="150" r="146" fill="#14324A"/><g clip-path="url(#lc)"><rect width="300" height="300" fill="#F7FBFE"/>
      ${ART.arcScale(cx, cy, R, 12, { big: true })}
      <line x1="${r1(baseX)}" y1="${r1(baseY)}" x2="${r1(tipX)}" y2="${r1(tipY)}" stroke="#FF5B00" stroke-width="5" stroke-linecap="round"/></g>
      <circle cx="150" cy="150" r="141" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/></svg><div class="lupa-cap">Лупа: стрелка весов</div>`;
  }
  function lupaCylinder() {
    const el = $("#lupa"); if (!el) return;
    const px = 13, lv = st.level, y = (v) => 150 - (v - lv) * px;
    let ticks = "";
    for (let v = Math.ceil((lv - 12) / 2) * 2; v <= lv + 12; v += 2) {
      if (v < 0 || v > 100) continue;
      const big = v % 10 === 0;
      ticks += `<line x1="40" y1="${r1(y(v))}" x2="${big ? 120 : 84}" y2="${r1(y(v))}" stroke="#14324A" stroke-width="${big ? 3 : 2}"/>`;
      if (big) ticks += `<text x="128" y="${r1(y(v) + 8)}" font-size="24" font-weight="700" fill="#14324A" font-family="var(--mono)">${v}</text>`;
    }
    el.innerHTML = `<svg viewBox="0 0 300 300" aria-hidden="true"><defs><clipPath id="lc"><circle cx="150" cy="150" r="140"/></clipPath></defs>
      <circle cx="150" cy="150" r="146" fill="#14324A"/><g clip-path="url(#lc)"><rect width="300" height="300" fill="#F3FAFD"/>
      <rect x="0" y="150" width="300" height="150" fill="#5CC4EE" opacity=".5"/><line x1="0" y1="150" x2="300" y2="150" stroke="#1E8FC6" stroke-width="3"/>${ticks}</g>
      <circle cx="150" cy="150" r="141" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/></svg><div class="lupa-cap">Лупа: уровень воды</div>`;
  }

  function render() {
    const lupa = $("#lupa");
    lupa.hidden = !(st.screen === "scales" || st.screen === "cyl");
    lupa.style.cssText = st.screen === "cyl" ? "left:4%;top:7%;width:clamp(170px,25%,280px)" : "left:4%;top:5%";
    $("#scene-svg").toggleAttribute("hidden", st.screen === "notebook");
    $("#notebook").hidden = st.screen !== "notebook";
    if (st.screen === "scales") { renderScales(); lupaScales(); }
    else if (st.screen === "cyl") { renderCylinder(); lupaCylinder(); }
    else if (st.screen === "ruler") renderRuler();
    renderPick();
    renderToolbar();
    st.listeners.forEach((fn) => fn("render"));
  }

  // Кнопки «куда положить» — поверх сцены сверху, а не в панели под ней.
  function renderPick() {
    const el = $("#pick");
    const id = st.selected;
    if (!id || (st.screen !== "scales" && st.screen !== "cyl")) { el.hidden = true; el.innerHTML = ""; return; }
    const o = byId(id);
    const name = isBody(id) ? `${o.n}. ${o.short}` : `гиря ${o.label}`;
    const b = st.screen === "scales"
      ? [["L", "На левую чашу"], ["R", "На правую чашу"], isBody(id) ? ["tray", "В лоток"] : ["box", "В футляр"]]
      : st.place[id] === "cyl" ? [["tray", "Вынуть из мензурки"]] : [["cyl", "Опустить в мензурку"]];
    el.innerHTML = `<span>${name}:</span>${b.map(([to, t]) => `<button class="btn sm" type="button" data-go="${to}">${t}</button>`).join("")}<button class="btn sm ghost" type="button" data-go="">Отмена</button>`;
    el.hidden = false;
    el.querySelectorAll("[data-go]").forEach((x) => x.addEventListener("click", () => { if (x.dataset.go) move(id, x.dataset.go); else { st.selected = null; render(); } }));
  }

  // Панель под сценой: только постоянные кнопки прибора, одна строка, высота не меняется.
  function renderToolbar() {
    const tb = $("#tools");
    const vol = st.screen === "cyl" || st.screen === "ruler";
    const parts = [];
    if (vol) parts.push(`<span class="seg" role="group" aria-label="Чем мерить объём"><button data-sc="cyl" aria-pressed="${st.screen === "cyl"}">Мензурка</button><button data-sc="ruler" aria-pressed="${st.screen === "ruler"}">Линейка</button></span>`);
    if (st.screen === "scales") {
      parts.push(`<span class="tool-hint">Перетащи предмет или нажми на него.</span>`);
      parts.push(`<span class="seg" role="group" aria-label="Полоски бумаги"><button data-strip="L+">+ полоска слева</button><button data-strip="R+">+ полоска справа</button><button data-strip="L-" aria-label="Снять полоску слева">− слева</button><button data-strip="R-" aria-label="Снять полоску справа">− справа</button></span>`);
      parts.push(`<button class="btn sm ghost" data-act="clear">Снять все гири</button>`);
    } else if (st.screen === "cyl") {
      parts.push(`<span class="tool-hint">Перетащи тело в мензурку или из неё.</span>`);
      parts.push(`<button class="btn sm ghost" data-act="dry">Вытереть тела тряпочкой</button>`);
    } else if (st.screen === "ruler") {
      parts.push(`<span class="tool-hint">Двигай уголок и прикладывай к брускам.</span>`);
      parts.push(`<span class="seg" role="group" aria-label="Какой брусок">${BODIES.filter((x) => x.shape === "brick").map((x) => `<button data-rb="${x.id}" aria-pressed="${st.ruler.body === x.id}">${x.n}</button>`).join("")}</span>`);
    } else parts.push(`<span class="tool-hint">Оформление работы в тетради.</span>`);
    tb.innerHTML = parts.join("");
    tb.querySelectorAll("[data-strip]").forEach((x) => x.addEventListener("click", () => strip(x.dataset.strip[0], x.dataset.strip[1] === "+" ? 1 : -1)));
    tb.querySelectorAll("[data-act]").forEach((x) => x.addEventListener("click", () => (x.dataset.act === "clear" ? clearWeights() : dry())));
    tb.querySelectorAll("[data-rb]").forEach((x) => x.addEventListener("click", () => { st.ruler.body = x.dataset.rb; render(); }));
    tb.querySelectorAll("[data-sc]").forEach((x) => x.addEventListener("click", () => setScreen(x.dataset.sc)));
  }

  // ── Перетаскивание: цель — зона под курсором, а если промахнулся, то ближайшая в пределах 160 px ──
  function point(ev) { const s = svg(); const p = s.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; const m = s.getScreenCTM(); return m ? p.matrixTransform(m.inverse()) : { x: 0, y: 0 }; }
  function zoneBoxes() {
    const sm = svg().getCTM().inverse();
    return [...svg().querySelectorAll(".zone")].map((z) => {
      const r = z.getBBox(), m = sm.multiply(z.getCTM());
      const a = new DOMPoint(r.x, r.y).matrixTransform(m), b = new DOMPoint(r.x + r.width, r.y + r.height).matrixTransform(m);
      return { zone: z.dataset.zone, x0: Math.min(a.x, b.x), y0: Math.min(a.y, b.y), x1: Math.max(a.x, b.x), y1: Math.max(a.y, b.y) };
    });
  }
  function zoneAt(x, y, id) {
    const ok = (z) => (isBody(id) ? z.zone !== "box" : z.zone !== "tray" && z.zone !== "cyl");
    const boxes = zoneBoxes().filter(ok);
    const inside = boxes.find((b) => x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1);
    if (inside) return inside.zone;
    let best = null, bd = 160;
    for (const b of boxes) { const dx = Math.max(b.x0 - x, 0, x - b.x1), dy = Math.max(b.y0 - y, 0, y - b.y1), d = Math.hypot(dx, dy); if (d < bd) { bd = d; best = b.zone; } }
    return best;
  }
  function wireItems() {
    const s = svg();
    s.classList.toggle("has-sel", !!st.selected);
    s.querySelectorAll(".zone").forEach((z) => z.addEventListener("click", () => { if (st.selected) move(st.selected, z.dataset.zone); }));
    s.querySelectorAll(".item").forEach((g) => {
      const id = g.dataset.id;
      let start = null;
      g.addEventListener("pointerdown", (ev) => {
        if (ev.button > 0) return;
        ev.preventDefault(); ev.stopPropagation();
        try { g.setPointerCapture(ev.pointerId); } catch (_) {}
        const p = point(ev); start = { x: p.x, y: p.y, moved: false };
      });
      g.addEventListener("pointermove", (ev) => {
        if (!start) return;
        const p = point(ev);
        if (!start.moved && Math.hypot(p.x - start.x, p.y - start.y) < 6) return;
        if (!start.moved) {
          start.moved = true;
          const pos = new DOMPoint(0, 0).matrixTransform(s.getCTM().inverse().multiply(g.getCTM()));
          start.ox = pos.x; start.oy = pos.y;
          $("#drag").appendChild(g); g.classList.add("dragging"); s.classList.add("has-sel");
        }
        g.setAttribute("transform", `translate(${r1(start.ox + p.x - start.x)} ${r1(start.oy + p.y - start.y)})`);
        const z = zoneAt(p.x, p.y, id);
        s.querySelectorAll(".zone").forEach((el) => el.classList.toggle("over", el.dataset.zone === z));
      });
      const end = (ev) => {
        if (!start) return;
        const s0 = start; start = null;
        if (!s0.moved) { st.selected = st.selected === id ? null : id; render(); return; }
        const p = point(ev);
        const z = zoneAt(p.x, p.y, id);
        if (!z || !move(id, z)) render();
      };
      g.addEventListener("pointerup", end);
      g.addEventListener("pointercancel", () => { start = null; render(); });
      g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); st.selected = st.selected === id ? null : id; render(); $(`[data-id="${id}"]`)?.focus(); } });
    });
  }

  // ── Физика: коромысло и вода. Кадры через rAF, при скрытой вкладке — таймер. ──
  let frame = 0, timer = 0, last = 0;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)");
  function kick() { if (!frame) { last = 0; schedule(); } }
  function schedule() { frame = requestAnimationFrame(loop); clearTimeout(timer); timer = setTimeout(() => { if (frame) { cancelAnimationFrame(frame); loop(performance.now()); } }, 90); }
  function loop(now) {
    clearTimeout(timer);
    const dt = last ? Math.min((now - last) / 1000, 0.08) : 1 / 60; last = now;
    const diff = load("L") - load("R") + TARE + STRIP * (st.strips.L - st.strips.R);
    const target = TMAX * Math.tanh(diff / 1.5);
    let busy = false;
    if (reduced.matches) { st.tilt = target; st.rate = 0; }
    else { const w = 4.6, z = 0.18, h = dt / 4; for (let i = 0; i < 4; i++) { st.rate += (-w * w * (st.tilt - target) - 2 * z * w * st.rate) * h; st.tilt += st.rate * h; } }
    if (Math.abs(st.tilt - target) < 2e-5 && Math.abs(st.rate) < 2e-5) { st.tilt = target; st.rate = 0; } else busy = true;
    const lt = levelTarget();
    st.level = reduced.matches ? lt : st.level + (lt - st.level) * (1 - Math.exp(-dt / 0.35));
    if (Math.abs(lt - st.level) < 0.01) st.level = lt; else busy = true;
    if (st.screen === "scales") {
      const B = ART.B, beam = $("#beam"), p = panPoints();
      if (beam) beam.setAttribute("transform", `rotate(${r1((-st.tilt * 18000) / Math.PI) / 100} ${B.px} ${B.py})`);
      for (const side of ["L", "R"]) { const g = $(`#pan-${side}`); if (g) g.setAttribute("transform", `translate(${r1(p[side].x)} ${r1(p[side].y)})`); }
      lupaScales();
    } else if (st.screen === "cyl" && busy) { renderCylinder(); lupaCylinder(); }
    if (!busy) settled();
    if (busy) schedule(); else frame = 0;
  }
  // Весы успокоились: тело на левой, гири на правой, стрелка на нуле — Кори кивает. Один раз на набор.
  function settled() {
    if (st.screen !== "scales" || !balanced()) return;
    const L = inPlace("L"), R = inPlace("R");
    if (!L.some(isBody) || L.some((id) => !isBody(id)) || !R.length || R.some(isBody)) return;
    const key = L.join() + "|" + R.sort().join();
    if (key === st.lastBalanced) return;
    st.lastBalanced = key;
    kori("ok_easy", "Равновесие!");
  }

  function setScreen(s) { st.screen = s; st.selected = null; say(""); render(); kick(); emit("screen", { screen: s }); }
  const truth = () => ({ V1, bodies: BODIES.map((b) => ({ ...b })) });
  const balanced = () => Math.abs(load("L") - load("R") + TARE + STRIP * (st.strips.L - st.strips.R)) < 0.05;
  const tareOk = () => Math.abs(TARE + STRIP * (st.strips.L - st.strips.R)) < 0.05;

  return { st, BODIES, WEIGHTS, V1, render, setScreen, move, resetScreen, clearWeights, dry, strip, on, emit, inPlace, load, balanced, tareOk, truth, kick, byId, say };
})();

  const PRED_TXT = { p1: { gt: "ρ₁ > ρ₂", lt: "ρ₁ < ρ₂", eq: "ρ₁ = ρ₂" }, p2: { gt: "m₁ > m₃", lt: "m₁ < m₃", eq: "m₁ = m₃" }, p3: { gold: "золото", pyrite: "пирит", "?": "пока не знаю" } };
  const predSummary = () => (Object.keys(S.pred).length ? `${w("Твой", "Прогноз класса")}${T() ? ":" : " прогноз:"} ${["p1", "p2", "p3"].filter((k) => S.pred[k]).map((k, i) => `${i + 1}) ${PRED_TXT[k][S.pred[k]]}`).join("; ")}.` : "Прогноз на шаге «Загадка» не записан.");

  // ── Отчёт учителю: эталон и сырые числа ученика. Открывается PIN-кодом. ──
  function teacherBlock() {
    if (!S.unlocked) return `<details class="teacher"><summary>Для учителя: эталон и отчёт</summary><p style="margin:8px 0">Введите PIN учителя.</p><div style="display:flex;gap:8px"><input id="pin" inputmode="numeric" autocomplete="off" style="width:7em;font:600 15px var(--mono);padding:6px 8px;border-radius:9px;border:1px solid var(--line)" aria-label="PIN учителя"><button class="btn sm" type="button" id="pin-go">Открыть</button></div></details>`;
    const tr = LAB.truth();
    const fmt = (v) => String(Math.round(v * 100) / 100).replace(".", ",");
    const num = (k) => { const v = Number(String(S.data[k] ?? "").replace(/\s/g, "").replace(",", ".")); return Number.isFinite(v) && String(S.data[k] ?? "").trim() !== "" ? v : null; };
    const pair = (k, truthV) => { const v = num(k); if (v === null) return `<td>—</td>`; const d = v - truthV; return `<td>${fmt(v)}${Math.abs(d) > 1e-9 ? ` <span class="dev">(${d > 0 ? "+" : ""}${fmt(d)})</span>` : ""}</td>`; };
    const dims = (b) => (b.shape === "brick" ? `${fmt(b.l)} × ${fmt(b.a)} × ${fmt(b.h)}` : "—");
    const rows = tr.bodies.map((b) => `<tr><td>${b.n}</td><td>${fmt(b.m)}</td>${T() ? "" : pair(`m${b.n}`, b.m)}<td>${b.floats ? "—" : fmt(tr.V1 + b.V)}</td><td>${fmt(b.V)}</td>${T() ? "" : pair(b.floats ? `vr${b.n}` : `vi${b.n}`, b.V)}<td>${dims(b)}</td><td>${fmt(b.rho)}</td>${T() ? "" : pair(`rho${b.n}`, b.rho)}<td>${b.mat}</td></tr>`).join("");
    const head = T() ? ["Тело", "m, г", "V₂, мл", "V, см³", "l × a × h, см", "ρ, г/см³", "Вещество"] : ["Тело", "m, г", "ученик", "V₂, мл", "V, см³", "ученик", "l × a × h", "ρ", "ученик", "Вещество"];
    const ev = st.log;
    const cnt = (t, r) => ev.filter((e) => e.type === t && (!r || e.rule === r)).length;
    const helps = Object.entries(S.help).map(([k, v]) => `${({ tare: "уравновешивание", mass: "масса", cyl: "мензурка", ruler: "линейка", rho: "плотность", unit: "перевод" })[k]}: ${v} из 3`).join(", ") || "не открывали";
    return `<details class="teacher" open><summary>Для учителя: эталон и отчёт</summary>
      <p style="margin:8px 0">V₁ = ${tr.V1} мл, цена деления мензурки 2 мл. Пустые весы ${LAB.tareOk() ? "уравновешены" : "не уравновешены: показания сдвинуты на 0,4 г"}. Истинный объём бруска = l · a · h; мензурка покажет его с точностью до деления.</p>
      <div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
      <p style="margin-top:8px">Подсказки: ${helps}. Нарушения правил: мокрое на весах — ${cnt("rule", "wet")}, перегруз — ${cnt("rule", "overload")}, сосна в мензурке — ${cnt("rule", "floats")}, тело справа или гиря слева — ${cnt("soft")}. ${Object.keys(S.pred).length ? "Прогноз: " + ["p1", "p2", "p3"].filter((k) => S.pred[k]).map((k) => PRED_TXT[k][S.pred[k]]).join("; ") + "." : ""}</p>
      <p class="dev" style="margin-top:6px">Закройте этот блок, прежде чем показывать экран классу.</p></details>`;
  }

  // ── Кори: правая сторона сцены, смотрит влево — на приборы ──
  let kori = null;
  try { kori = Kori.mount($("#kori"), { facing: "left", srcs: KORI_POSES, start: "idle" }); } catch (_) { kori = null; }
  const play = (b, text) => { if (kori) kori.play(b, text); };
  LAB.on((type, d) => { if (type === "kori") play(d.behavior, d.text); });

  // ── Отрисовка журнала ──
  function render() {
    const s = STEPS[S.step];
    $("#p-kicker").textContent = `Шаг ${S.step + 1} из ${STEPS.length}`;
    $("#p-title").textContent = { 0: "Как работать с весами", 1: "Загадка и прогноз", 2: "Масса", 3: "Объём", 4: "Плотность и вещество", 5: "Вывод — в тетрадь" }[S.step];
    $("#p-body").innerHTML = s.html();
    $("#prev").disabled = S.step === 0;
    $("#next").textContent = S.step === STEPS.length - 1 ? "В начало" : "Дальше";
    $$("#steps button").forEach((b, i) => { b.toggleAttribute("data-seen", S.seen.has(i)); if (i === S.step) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); });
    $$("[data-k]").forEach((inp) => inp.addEventListener("input", () => { S.data[inp.dataset.k] = inp.value; }));
    $$("[data-pred]").forEach((b) => b.addEventListener("click", () => { S.pred[b.dataset.pred] = b.dataset.v; LAB.emit("pred", { q: b.dataset.pred, v: b.dataset.v }); render(); }));
    $$("[data-more]").forEach((b) => b.addEventListener("click", () => { const k = b.dataset.more; S.help[k] = Math.min(Number(b.dataset.max), (S.help[k] || 0) + 1); LAB.emit("help", { k, level: S.help[k] }); play("hint"); render(); }));
    $("#finish")?.addEventListener("click", () => { S.finished = true; LAB.emit("finish", { data: { ...S.data } }); play("module_done", "Работа готова!"); render(); });
    $("#pin-go")?.addEventListener("click", () => { if ($("#pin").value.trim() === PIN) { S.unlocked = true; render(); } else { $("#pin").value = ""; $("#pin").placeholder = "Не тот PIN"; } });
    $("#pin")?.addEventListener("keydown", (e) => { if (e.key === "Enter") $("#pin-go").click(); });
  }
  function go(i) {
    S.step = Math.max(0, Math.min(STEPS.length - 1, i));
    S.seen.add(S.step);
    const s = STEPS[S.step];
    if (s.screen) LAB.setScreen(s.screen);
    render();
    $("#p-body").scrollTop = 0;
    if (s.kori) play(s.kori[0], s.kori[1]);
  }

  // ── Шапка: шаги, режим, сброс текущего прибора ──
  $("#steps").innerHTML = STEPS.map((s, i) => `<button type="button" data-step="${i}"><span class="n">${i + 1}</span>${s.title}</button>`).join("");
  $$("#steps button").forEach((b) => b.addEventListener("click", () => go(Number(b.dataset.step))));
  $$("#mode button").forEach((b) => b.addEventListener("click", () => {
    S.mode = b.dataset.mode;
    $$("#mode button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    document.body.classList.toggle("big-text", T());
    render();
  }));
  $("#reset").addEventListener("click", () => LAB.resetScreen());
  $("#prev").addEventListener("click", () => go(S.step - 1));
  $("#next").addEventListener("click", () => go(S.step === STEPS.length - 1 ? 0 : S.step + 1));
  document.body.classList.add("big-text");
  const fitHead = () => document.documentElement.style.setProperty("--head", $(".top").offsetHeight + "px");
  addEventListener("resize", fitHead); fitHead();

  // Тетрадь: экзаменационное оформление и одна большая таблица на всю работу.
  $("#notebook").innerHTML = `<h3>Как оформить работу в тетради</h3>
    <div class="exam"><p>Используя рычажные весы с разновесом, мензурку с водой, нить и тело, соберите установку для определения плотности материала тела. В тетради:</p>
    <ol><li>сделайте схематичный рисунок экспериментальной установки для определения объёма тела;</li><li>запишите формулу для расчёта плотности;</li><li>укажите результаты измерений массы тела и его объёма;</li><li>запишите численное значение плотности материала тела.</li></ol></div>
    <div class="schemes"><figure>${ART.schemeBalance()}<figcaption>Рисунок 1. Взвешивание: тело слева, гири справа.</figcaption></figure><figure>${ART.schemeCylinder()}<figcaption>Рисунок 2. Объём погружением: V = V₂ − V₁.</figcaption></figure></div>
    <p style="margin:14px 0 4px;font-weight:700">Таблица 1. Результаты измерений и вычислений</p>
    ${bigTable("exam-t")}
    <p style="margin-top:12px;max-width:760px">Дальше — <b>вывод</b> своими словами. Тему, цель и приборы записывают в начале работы.</p>`;

  go(0);
})();
</script>

</body>
</html>
