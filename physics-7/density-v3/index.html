<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Плотность твёрдого тела — ЛР</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>/* Кори: 25 поведений. Смена позы + CSS-движение + эффекты кодом. Без библиотек.
 * --dir: 1 — Кори смотрит вправо (стоит слева от задачи), -1 — смотрит влево.
 * Все горизонтальные сдвиги и наклоны умножаются на --dir, поэтому одна анимация работает в обе стороны. */

.kori {
  --kori-size: 240px;
  --dir: 1;
  --kori-accent: #1f7ae0;
  --kori-bubble-bg: #ffffff;
  --kori-bubble-fg: #14304f;
  --kori-shadow: rgba(20, 60, 120, .24);
  position: relative;
  width: var(--kori-size);
  padding-top: 76px;               /* место под реплику в две строки */
  user-select: none;
  -webkit-user-select: none;
}

.kori__stage { position: relative; aspect-ratio: 1; }

/* Тело: анимации крутятся вокруг точки у ног (ноги поз выровнены на 463/512) */
.kori__body {
  position: absolute;
  inset: 0;
  transform-origin: 50% 90.4%;
  will-change: transform, opacity;
  z-index: 2;
}

.kori__pose {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  transition: opacity 90ms linear;
  pointer-events: none;
}
.kori__pose.is-active { opacity: 1; }

.kori__shadow {
  position: absolute;
  left: 25%;
  right: 25%;
  top: 87%;
  height: 7%;
  border-radius: 50%;
  background: radial-gradient(closest-side, var(--kori-shadow), transparent);
  transition: opacity 120ms linear;
  z-index: 1;
}
/* У поз с нарисованной тенью своя тень, кодовую прячем */
.kori[data-own-shadow] .kori__shadow { opacity: 0; }

/* Слои эффектов: позади тела, на теле (двигаются вместе с ним), впереди */
.kori__back, .kori__front, .kori__attached { position: absolute; inset: 0; pointer-events: none; }
.kori__back { z-index: 0; }
.kori__front { z-index: 3; }

/* ---------- Реплика ---------- */
.kori__bubble {
  position: absolute;
  top: 0;
  left: calc(50% + var(--dir) * 6%);
  width: max-content;
  max-width: 100%;
  padding: 8px 14px;
  border-radius: 16px;
  background: var(--kori-bubble-bg);
  color: var(--kori-bubble-fg);
  font: 700 17px/1.25 system-ui, -apple-system, "Segoe UI", sans-serif;
  text-align: center;
  box-shadow: 0 4px 14px rgba(20, 60, 120, .16), 0 0 0 2px var(--kori-accent) inset;
  transform: translateX(-50%) scale(.6);
  opacity: 0;
  z-index: 4;
}
.kori__bubble::after {
  content: "";
  position: absolute;
  left: calc(50% - var(--dir) * 18%);
  bottom: -7px;
  width: 14px;
  height: 14px;
  background: var(--kori-bubble-bg);
  box-shadow: 2px 2px 0 0 var(--kori-accent);
  transform: translateX(-50%) rotate(45deg);
}
.kori__bubble.is-shown { animation: kori-bubble 320ms cubic-bezier(.3, 1.6, .5, 1) forwards; }
@keyframes kori-bubble { to { transform: translateX(-50%) scale(1); opacity: 1; } }

/* =========================================================
   ДВИЖЕНИЯ ТЕЛА  (data-motion на корне)
   ========================================================= */
.kori[data-motion="breathe"]     .kori__body { animation: k-breathe 3.2s ease-in-out infinite; }
.kori[data-motion="look"]        .kori__body { animation: k-look 1.6s ease-in-out both; }
.kori[data-motion="think"]       .kori__body { animation: k-think-in .5s ease-out both, k-breathe 3.6s ease-in-out .5s infinite; }
.kori[data-motion="sway"]        .kori__body { animation: k-sway 3s ease-in-out infinite; }
.kori[data-motion="sink"]        .kori__body { animation: k-sink 1.2s ease-in-out both, k-sleep 3.6s ease-in-out 1.2s infinite; }
.kori[data-motion="enter"]       .kori__body { animation: k-enter .8s cubic-bezier(.25, .9, .35, 1.15) both; }
.kori[data-motion="leave"]       .kori__body { animation: k-leave .6s ease-in both; }
.kori[data-motion="wave"]        .kori__body { animation: k-wave 1.1s ease-in-out both; }
.kori[data-motion="lean"]        .kori__body { animation: k-lean 1.8s ease-in-out both; }
.kori[data-motion="nudge"]       .kori__body { animation: k-nudge 1.1s ease-in-out both; }
.kori[data-motion="pop"]         .kori__body { animation: k-pop .48s cubic-bezier(.3, 1.6, .5, 1) both; }
.kori[data-motion="eureka"]      .kori__body { animation: k-eureka .7s cubic-bezier(.3, 1.4, .5, 1) both; }
.kori[data-motion="jump"]        .kori__body { animation: k-jump .76s cubic-bezier(.3, .7, .4, 1) both; }
.kori[data-motion="hop"]         .kori__body { animation: k-hop .55s cubic-bezier(.3, .7, .4, 1) both; }
.kori[data-motion="nod"]         .kori__body { animation: k-nod .9s ease-in-out both; }
.kori[data-motion="spin"]        .kori__body { animation: k-spin 1s cubic-bezier(.3, .7, .4, 1) both; }
.kori[data-motion="double"]      .kori__body { animation: k-jump .62s cubic-bezier(.3, .7, .4, 1) 2 both; }
.kori[data-motion="shine"]       .kori__body { animation: k-shine 1.4s ease-in-out both; }
.kori[data-motion="float"]       .kori__body { animation: k-float 2.2s ease-in-out both; }
.kori[data-motion="ponder"]      .kori__body { animation: k-ponder .9s ease-in-out both; }
.kori[data-motion="tilt"]        .kori__body { animation: k-tilt 2.2s ease-in-out both; }
.kori[data-motion="encourage"]   .kori__body { animation: k-encourage 1.2s ease-in-out both; }
.kori[data-motion="shiver"]      .kori__body { animation: k-shiver .45s linear both; }
.kori[data-motion="startle"]     .kori__body { animation: k-startle .8s cubic-bezier(.3, .7, .4, 1) both; }

/* тень повторяет вертикальные движения: в прыжке сжимается */
.kori[data-motion="jump"]   .kori__shadow { animation: k-shadow-jump .76s cubic-bezier(.3, .7, .4, 1) both; }
.kori[data-motion="double"] .kori__shadow { animation: k-shadow-jump .62s cubic-bezier(.3, .7, .4, 1) 2 both; }
.kori[data-motion="spin"]   .kori__shadow { animation: k-shadow-jump 1s cubic-bezier(.3, .7, .4, 1) both; }
.kori[data-motion="hop"]    .kori__shadow { animation: k-shadow-small .55s ease-out both; }
.kori[data-motion="pop"]    .kori__shadow { animation: k-shadow-small .48s ease-out both; }
.kori[data-motion="eureka"] .kori__shadow { animation: k-shadow-small .7s ease-out both; }
.kori[data-motion="startle"] .kori__shadow { animation: k-shadow-small .8s ease-out both; }
.kori[data-motion="float"]  .kori__shadow { animation: k-shadow-float 2.2s ease-in-out both; }
.kori[data-motion="enter"]  .kori__shadow { animation: k-fade-in .8s ease-out both; }
.kori[data-motion="leave"]  .kori__shadow { animation: k-fade-out .6s ease-in both; }

@keyframes k-breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.012, .988); } }
@keyframes k-look {
  0%, 100% { transform: none; }
  30%, 60% { transform: translateX(calc(var(--dir) * 3%)) rotate(calc(var(--dir) * 4deg)); }
}
@keyframes k-think-in { from { transform: none; } to { transform: rotate(calc(var(--dir) * -2deg)); } }
@keyframes k-sway {
  0%, 100% { transform: rotate(calc(var(--dir) * -2deg)); }
  50%      { transform: rotate(calc(var(--dir) * 2deg)); }
}
@keyframes k-sink { to { transform: translateY(1.5%) scale(1.03, .96) rotate(calc(var(--dir) * -3deg)); } }
@keyframes k-sleep {
  0%, 100% { transform: translateY(1.5%) scale(1.03, .96) rotate(calc(var(--dir) * -3deg)); }
  50%      { transform: translateY(1.5%) scale(1.045, .945) rotate(calc(var(--dir) * -3deg)); }
}
/* появляется с той стороны, куда смотрит спиной, и въезжает к задаче */
@keyframes k-enter {
  0%   { transform: translateX(calc(var(--dir) * -120%)); opacity: 0; }
  60%  { transform: translateX(calc(var(--dir) * 6%)) scale(1.04, .96); opacity: 1; }
  80%  { transform: translateX(calc(var(--dir) * -2%)); }
  100% { transform: none; opacity: 1; }
}
@keyframes k-leave {
  0%   { transform: none; opacity: 1; }
  25%  { transform: scale(1.05, .94); }
  100% { transform: translateX(calc(var(--dir) * -120%)) translateY(-6%); opacity: 0; }
}
@keyframes k-wave {
  0%, 100% { transform: none; }
  15%, 55% { transform: rotate(-5deg); }
  35%, 75% { transform: rotate(5deg); }
}
@keyframes k-lean {
  0%, 100% { transform: none; }
  25%, 75% { transform: translateX(calc(var(--dir) * 4%)) rotate(calc(var(--dir) * 6deg)); }
}
@keyframes k-nudge {
  0%, 100% { transform: none; }
  20%, 60% { transform: translateX(calc(var(--dir) * 6%)) rotate(calc(var(--dir) * 5deg)); }
  40%, 80% { transform: translateX(calc(var(--dir) * 2%)) rotate(calc(var(--dir) * 2deg)); }
}
@keyframes k-pop {
  0%   { transform: none; }
  40%  { transform: translateY(-6%) scale(1.05); }
  100% { transform: none; }
}
@keyframes k-eureka {
  0%   { transform: none; }
  20%  { transform: scale(1.08, .9); }
  50%  { transform: translateY(-10%) scale(.96, 1.06); }
  100% { transform: none; }
}
@keyframes k-jump {
  0%   { transform: translateY(0)    scale(1, 1); }
  18%  { transform: translateY(0)    scale(1.1, .88); }
  45%  { transform: translateY(-22%) scale(.94, 1.07); }
  62%  { transform: translateY(-24%) scale(.98, 1.02); }
  82%  { transform: translateY(0)    scale(1.08, .92); }
  100% { transform: translateY(0)    scale(1, 1); }
}
@keyframes k-hop {
  0%   { transform: none; }
  25%  { transform: scale(1.06, .92); }
  55%  { transform: translateY(-9%) scale(.97, 1.04); }
  85%  { transform: scale(1.04, .96); }
  100% { transform: none; }
}
@keyframes k-nod {
  0%, 100% { transform: none; }
  20%, 60% { transform: scale(1.03, .95) rotate(calc(var(--dir) * 2deg)); }
  40%, 80% { transform: none; }
}
/* разворот в прыжке: scaleX уходит в минус — Кори на миг показывает другую сторону */
@keyframes k-spin {
  0%   { transform: translateY(0)    scale(1, 1); }
  15%  { transform: translateY(0)    scale(1.1, .88); }
  35%  { transform: translateY(-20%) scale(.2, 1.05); }
  50%  { transform: translateY(-24%) scale(-1, 1.04); }
  65%  { transform: translateY(-20%) scale(.2, 1.03); }
  85%  { transform: translateY(0)    scale(1.08, .92); }
  100% { transform: translateY(0)    scale(1, 1); }
}
@keyframes k-shine {
  0%, 100% { transform: none; }
  30%      { transform: scale(1.07); }
  55%      { transform: scale(.99); }
  75%      { transform: scale(1.03); }
}
@keyframes k-float {
  0%   { transform: none; }
  15%  { transform: scale(1.06, .92); }
  45%, 70% { transform: translateY(-14%) scale(1.02); }
  100% { transform: none; }
}
@keyframes k-ponder {
  0%   { transform: rotate(0); }
  25%  { transform: rotate(calc(var(--dir) * -4deg)); }
  55%  { transform: rotate(calc(var(--dir) * 3deg)); }
  80%  { transform: rotate(calc(var(--dir) * -1.5deg)); }
  100% { transform: rotate(0); }
}
@keyframes k-tilt {
  0%, 100% { transform: none; }
  30%      { transform: rotate(calc(var(--dir) * -5deg)); }
  65%      { transform: rotate(calc(var(--dir) * 4deg)); }
}
@keyframes k-encourage {
  0%, 100% { transform: none; }
  20%, 55% { transform: translateX(calc(var(--dir) * 3%)) rotate(calc(var(--dir) * 4deg)) scale(1.02, .97); }
  38%, 75% { transform: translateY(-3%); }
}
@keyframes k-shiver {
  0%, 100% { transform: none; }
  20% { transform: translateX(-1.5%); }
  40% { transform: translateX(1.5%); }
  60% { transform: translateX(-1%); }
  80% { transform: translateX(1%); }
}
/* отпрянул от неожиданного: назад от задачи и вверх */
@keyframes k-startle {
  0%   { transform: none; }
  25%  { transform: translateX(calc(var(--dir) * -6%)) translateY(-9%) scale(.96, 1.06) rotate(calc(var(--dir) * -5deg)); }
  60%  { transform: translateX(calc(var(--dir) * -4%)) scale(1.04, .96); }
  100% { transform: none; }
}

@keyframes k-shadow-jump {
  0%, 100% { transform: scale(1);    opacity: 1; }
  18%      { transform: scale(1.1);  opacity: 1; }
  45%, 62% { transform: scale(.55);  opacity: .45; }
  82%      { transform: scale(1.12); opacity: 1; }
}
@keyframes k-shadow-small { 40%, 55% { transform: scale(.8); opacity: .7; } }
@keyframes k-shadow-float { 45%, 70% { transform: scale(.7); opacity: .5; } }
@keyframes k-fade-in  { from { opacity: 0; } to { opacity: 1; } }
@keyframes k-fade-out { from { opacity: 1; } to { opacity: 0; } }

/* =========================================================
   ЭФФЕКТЫ  (элементы создаёт kori.js; позиция — через --x/--y в % от сцены)
   ========================================================= */
.fx { position: absolute; left: var(--x); top: var(--y); pointer-events: none; }

/* искры */
.fx-spark {
  width: 10px; height: 10px; border-radius: 2px; background: var(--c);
  opacity: 0; animation: fx-spark .7s ease-out var(--d, .18s) forwards;
}
@keyframes fx-spark {
  0%   { transform: translate(-50%, -50%) rotate(0) scale(.4); opacity: 1; }
  100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(140deg) scale(1); opacity: 0; }
}

/* конфетти падает сверху */
.fx-confetti {
  width: 8px; height: 12px; border-radius: 2px; background: var(--c);
  opacity: 0; animation: fx-confetti var(--t, 1.8s) cubic-bezier(.25, .5, .5, 1) var(--d, 0s) forwards;
}
@keyframes fx-confetti {
  0%   { transform: translate(0, -40px) rotate(0); opacity: 1; }
  80%  { opacity: 1; }
  100% { transform: translate(var(--dx), 260px) rotate(var(--r)); opacity: 0; }
}

/* сердечки и звёзды всплывают */
.fx-heart, .fx-star { width: var(--s, 22px); height: var(--s, 22px); opacity: 0; }
.fx-heart { animation: fx-rise 1.6s ease-out var(--d, 0s) forwards; color: #ff5d8f; }
.fx-star  { animation: fx-twinkle 1.2s ease-in-out var(--d, 0s) forwards; color: #ffc93c; }
.fx-heart svg, .fx-star svg { width: 100%; height: 100%; display: block; fill: currentColor; }
@keyframes fx-rise {
  0%   { transform: translate(-50%, 0) scale(.4); opacity: 0; }
  20%  { opacity: 1; }
  100% { transform: translate(calc(-50% + var(--dx, 0px)), -110px) scale(1.1); opacity: 0; }
}
@keyframes fx-twinkle {
  0%   { transform: translate(-50%, -50%) scale(0) rotate(0); opacity: 0; }
  40%  { transform: translate(-50%, -50%) scale(1.15) rotate(30deg); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(.6) rotate(70deg); opacity: 0; }
}

/* Z z z — плывут вверх в сторону взгляда, по кругу */
.fx-z {
  font: 800 22px/1 system-ui, sans-serif; color: var(--kori-accent);
  opacity: 0; animation: fx-z 2.4s ease-in-out var(--d, 0s) infinite;
}
@keyframes fx-z {
  0%   { transform: translate(-50%, 0) scale(.5); opacity: 0; }
  25%  { opacity: 1; }
  100% { transform: translate(calc(-50% + var(--dir) * 50px), -70px) scale(1.2); opacity: 0; }
}

/* «думает»: облачко с тремя точками */
.fx-dots {
  display: flex; gap: 5px; padding: 8px 10px; border-radius: 16px;
  background: var(--kori-bubble-bg); box-shadow: 0 0 0 2px var(--kori-accent) inset;
  transform: translate(-50%, -50%) scale(0); animation: fx-pop-in .3s cubic-bezier(.3, 1.6, .5, 1) .2s forwards;
}
.fx-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--kori-accent); animation: fx-dot 1.2s ease-in-out infinite; }
.fx-dots i:nth-child(2) { animation-delay: .2s; }
.fx-dots i:nth-child(3) { animation-delay: .4s; }
@keyframes fx-dot { 0%, 60%, 100% { transform: translateY(0); opacity: .35; } 30% { transform: translateY(-5px); opacity: 1; } }
@keyframes fx-pop-in { to { transform: translate(-50%, -50%) scale(1); } }

/* знаки ? и ! */
.fx-q, .fx-bang {
  font: 900 30px/1 system-ui, sans-serif; color: var(--kori-accent);
  -webkit-text-stroke: 1px #fff;
  transform: translate(-50%, -50%) scale(0);
}
.fx-q    { animation: fx-q 1.4s cubic-bezier(.3, 1.6, .5, 1) var(--d, 0s) forwards; }
.fx-bang { font-size: 44px; color: #ff8a3d; animation: fx-bang .9s cubic-bezier(.3, 1.6, .5, 1) forwards; }
@keyframes fx-q {
  0%   { transform: translate(-50%, -50%) scale(0) rotate(0); opacity: 1; }
  25%  { transform: translate(-50%, -50%) scale(1) rotate(var(--r, 0deg)); }
  70%  { transform: translate(-50%, calc(-50% - 6px)) scale(1) rotate(var(--r, 0deg)); opacity: 1; }
  100% { transform: translate(-50%, calc(-50% - 10px)) scale(.9) rotate(var(--r, 0deg)); opacity: 0; }
}
@keyframes fx-bang {
  0%   { transform: translate(-50%, -50%) scale(0); }
  35%  { transform: translate(-50%, -60%) scale(1.25); }
  60%, 85% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
}

/* свечение лампы — привязано к телу, двигается вместе с ним */
.fx-glow {
  width: 90px; height: 90px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255, 220, 90, .85), rgba(255, 220, 90, .25) 60%, transparent);
  mix-blend-mode: screen;
  transform: translate(-50%, -50%) scale(.3); opacity: 0;
  animation: fx-glow 1.1s ease-in-out 3 forwards;
}
@keyframes fx-glow {
  0%   { transform: translate(-50%, -50%) scale(.4); opacity: 0; }
  45%  { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(.8); opacity: .2; }
}

/* лучи за спиной */
.fx-rays {
  width: 150%; height: 150%;
  background: repeating-conic-gradient(from 0deg, rgba(255, 201, 60, .38) 0deg 10deg, transparent 10deg 30deg);
  -webkit-mask: radial-gradient(closest-side, #000 30%, transparent 100%);
          mask: radial-gradient(closest-side, #000 30%, transparent 100%);
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(.2) rotate(0); opacity: 0;
  animation: fx-rays 2.6s ease-out forwards;
}
@keyframes fx-rays {
  15%  { opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1) rotate(calc(var(--dir) * 60deg)); opacity: 0; }
}

/* волна-кольцо от ног */
.fx-ring {
  width: 40px; height: 40px; border-radius: 50%; border: 4px solid var(--kori-accent);
  transform: translate(-50%, -50%) scale(.3); opacity: 0;
  animation: fx-ring 1.2s ease-out var(--d, 0s) forwards;
}
@keyframes fx-ring {
  0%   { transform: translate(-50%, -50%) scale(.3); opacity: .9; }
  100% { transform: translate(-50%, -50%) scale(6); opacity: 0; border-width: 1px; }
}

/* значок серии */
.fx-badge {
  min-width: 46px; height: 46px; padding: 0 8px; border-radius: 23px;
  display: grid; place-items: center;
  background: #ff8a3d; color: #fff; font: 900 20px/1 system-ui, sans-serif;
  box-shadow: 0 0 0 3px #fff, 0 6px 14px rgba(255, 138, 61, .45);
  transform: translate(-50%, -50%) scale(0) rotate(-20deg);
  animation: fx-badge .5s cubic-bezier(.3, 1.6, .5, 1) .25s forwards;
}
@keyframes fx-badge { to { transform: translate(-50%, -50%) scale(1) rotate(calc(var(--dir) * 8deg)); } }

/* стрелка к задаче */
.fx-arrow {
  width: 54px; height: 30px; color: var(--kori-accent);
  transform: translate(-50%, -50%) scaleX(var(--dir));
  animation: fx-arrow .7s ease-in-out 3;
}
.fx-arrow svg { width: 100%; height: 100%; display: block; }
@keyframes fx-arrow {
  0%, 100% { transform: translate(-50%, -50%) scaleX(var(--dir)); }
  50%      { transform: translate(calc(-50% + var(--dir) * 12px), -50%) scaleX(var(--dir)); }
}

/* капля «ой» */
.fx-drop {
  width: 14px; height: 20px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
  background: linear-gradient(#bfe6ff, #5cb8ff); box-shadow: 0 0 0 2px #fff;
  transform: translate(-50%, -50%) rotate(180deg) scale(0);
  animation: fx-drop 1.3s ease-in forwards;
}
@keyframes fx-drop {
  0%   { transform: translate(-50%, -50%) rotate(180deg) scale(0); opacity: 1; }
  25%  { transform: translate(-50%, -50%) rotate(180deg) scale(1); }
  70%  { opacity: 1; }
  100% { transform: translate(-50%, calc(-50% + 34px)) rotate(180deg) scale(.9); opacity: 0; }
}

/* =========================================================
   Кто отключил анимацию в системе: только поза, реплика и неподвижные значки
   ========================================================= */
@media (prefers-reduced-motion: reduce) {
  .kori .kori__body, .kori .kori__shadow { animation: none !important; }
  .kori .fx { animation: none !important; display: none; }
  .kori .fx-badge, .kori .fx-dots { display: grid; transform: translate(-50%, -50%); }
  .kori .fx-dots { display: flex; }
  .kori .fx-dots i { animation: none; opacity: .7; }
  .kori__bubble.is-shown { animation: none; transform: translateX(-50%); opacity: 1; }
  .kori[data-behavior="leave"] .kori__body { opacity: 0; }
}

/* Лаборатория на одном экране: шапка с шагами, слева прибор, справа журнал шага. Ничего не скроллится на десктопе. */
:root{
  --bg:#EEF2F5;--card:#FFFFFF;--ink:#14324A;--text:#3F5F78;--muted:#7F93A3;--line:#DCE3E9;
  --teal:#00A3B9;--teal-ink:#007F91;--teal-soft:#DFF4F7;--orange:#FF5B00;--orange-soft:#FFEFE4;
  --sky:#E7F1F8;--table:#C99A62;--table-dark:#9C7140;--glass:#EAF6FB;--water:#3FB6E8;--water-deep:#1E8FC6;
  --gold-1:#FFE07A;--gold-2:#D7A426;--gold-3:#9A6B0E;--brass-1:#F6D27A;--brass-2:#C9962E;--brass-3:#8A6416;
  --steel-1:#C9D3DC;--steel-2:#7E8D9A;--steel-3:#4D5B67;--al-1:#F3F6F8;--al-2:#BFC9D1;--al-3:#8C99A4;
  --wood-1:#E9C48E;--wood-2:#C9955A;--wood-3:#9A6A35;
  --font:"Raleway",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --head:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1B26;--card:#142636;--ink:#E8F0F5;--text:#A9BFCE;--muted:#6F8797;--line:#24394B;--teal:#2BC3D6;--teal-ink:#5ED6E5;--teal-soft:#123A45;--orange:#FF7A2E;--orange-soft:#3A2618;--sky:#18303F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1B26;--card:#142636;--ink:#E8F0F5;--text:#A9BFCE;--muted:#6F8797;--line:#24394B;--teal:#2BC3D6;--teal-ink:#5ED6E5;--teal-soft:#123A45;--orange:#FF7A2E;--orange-soft:#3A2618;--sky:#18303F;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);font-variant-numeric:lining-nums}
button{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* Шапка */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px clamp(10px,1.4vw,18px);background:var(--card);box-shadow:0 1px 0 var(--line);position:sticky;top:0;z-index:5;min-height:var(--head)}
.title{display:grid;line-height:1.15;margin-right:auto;min-width:0}
.title small{color:var(--teal-ink);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.title b{color:var(--ink);font-size:17px;font-weight:800}
.steps{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.steps button{border:0;background:var(--bg);color:var(--ink);font-weight:700;font-size:12.5px;border-radius:32px;padding:6px 11px 6px 6px;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.steps button .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--card);font-size:11px}
.steps button[aria-current="step"]{background:var(--teal);color:#fff}
.steps button[aria-current="step"] .n{background:rgba(255,255,255,.25)}
.steps button[data-seen]:not([aria-current]) .n{background:var(--teal-soft);color:var(--teal-ink)}
.seg{display:inline-flex;gap:3px;background:var(--bg);border-radius:32px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink);font-weight:700;font-size:13px;padding:6px 12px;border-radius:32px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 0 0 2px var(--teal)}
.btn{border:0;border-radius:32px;background:var(--teal);color:#fff;font-weight:700;font-size:14px;padding:9px 16px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn.warn{background:var(--orange)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Рабочая область: высота окна минус шапка */
.work{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:12px;padding:12px clamp(10px,1.4vw,18px);height:calc(100dvh - var(--head));min-height:540px}
@media (max-width:1060px){.work{grid-template-columns:1fr;height:auto}}
.stage{background:var(--card);border-radius:24px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
@media (max-width:1060px){.stage{height:min(78vh,720px)}}
.scene{flex:1;min-height:0;position:relative}
.scene{overflow:hidden;background:#EAF3F9}
.scene>svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;overflow:visible}
.toolbar{display:flex;flex-wrap:nowrap;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);background:var(--card);height:56px;overflow-x:auto;overflow-y:hidden;flex:none}
.tool-hint{flex:1 1 auto;min-width:160px;color:var(--ink);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar .seg,.toolbar .btn{flex:none}
.toolbar .say{flex:1 1 260px;min-width:0;color:var(--ink);font-size:14px}
.toolbar .say[data-kind="env"]{color:#B4400A;font-weight:700}
.lupa{position:absolute;width:clamp(150px,19%,230px);aspect-ratio:1;pointer-events:none}
.lupa svg{width:100%;height:100%;display:block}
.lupa.cyl{pointer-events:auto;touch-action:none}
.lupa-cap{position:absolute;left:0;right:0;bottom:-26px;text-align:center;font-size:12.5px;font-weight:700;color:var(--ink)}

/* Журнал */
.panel{background:var(--card);border-radius:24px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel-head{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.panel-head h2{margin:2px 0 0;color:var(--ink);font-size:20px;font-weight:800;line-height:1.2}
.panel-head .kicker{color:var(--teal-ink);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.panel-body{flex:1;overflow:auto;padding:14px 18px 18px;display:grid;gap:14px;align-content:start}
.panel-foot{display:flex;gap:8px;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line)}
.panel p{margin:0}
.panel ol,.panel ul{margin:0;padding-left:20px;display:grid;gap:5px}
.box{border-radius:16px;padding:12px 14px;background:var(--bg);color:var(--ink)}
.box.note{background:var(--teal-soft)}
.box.write{background:var(--orange-soft);border-left:4px solid var(--orange)}
.box.write b:first-child{display:block;color:#B4400A;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.rules li{padding-left:2px}
.rules li b{color:var(--ink)}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices button{border:0;border-radius:32px;background:var(--bg);color:var(--ink);font-weight:700;font-size:14px;padding:8px 14px;cursor:pointer}
.choices button[aria-pressed="true"]{background:var(--teal-soft);box-shadow:0 0 0 2px var(--teal)}
.qcard{display:grid;gap:8px}
.qcard h3{margin:0;color:var(--ink);font-size:15px}
.qcard svg{width:100%;height:auto;background:#fff;border-radius:12px;box-shadow:0 0 0 1px var(--line)}
.tbl{width:100%;border-collapse:separate;border-spacing:4px;font-size:13px}
.tbl th{color:var(--muted);font-weight:700;text-align:left;font-size:12px;white-space:nowrap}
.tbl td input,.tbl td select{width:100%;min-width:0;font:600 14px var(--mono);color:var(--ink);background:var(--bg);border:1px solid transparent;border-radius:9px;padding:5px 6px}
.tbl td input:focus,.tbl td select:focus{outline:none;border-color:var(--teal);background:var(--card)}
.tbl td.name{color:var(--ink);font-weight:700;white-space:nowrap}
.tbl.tpl td{border-bottom:1px dashed var(--line);height:26px}
.help ol{list-style:none;padding:0;margin:0 0 8px;display:grid;gap:6px}
.help li{background:var(--teal-soft);border-radius:12px;padding:9px 12px;color:var(--ink);font-size:14px}
.help li b{display:block;color:var(--teal-ink);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.dens{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13.5px}
.dens span:nth-child(even){font-family:var(--mono);color:var(--ink);text-align:right}
textarea{width:100%;font:14px var(--font);color:var(--ink);background:var(--bg);border:1px solid transparent;border-radius:10px;padding:8px}
details.teacher summary{cursor:pointer;color:var(--ink);font-weight:800}
.teacher .tbl td{font-family:var(--mono);color:var(--ink)}
.dev{color:#B4400A}
body.big-text .panel{font-size:17px}
body.big-text .panel-head h2{font-size:24px}
/* Цели переноса: видны, только когда предмет выбран или тащится */
.zone{fill:transparent;stroke:none;pointer-events:none}
svg.has-sel .zone{fill:rgba(0,163,185,.06);stroke:#00A3B9;stroke-width:2;stroke-dasharray:8 6;pointer-events:all;cursor:pointer}
svg.has-sel .zone.over{fill:rgba(0,163,185,.18)}
.item{cursor:grab}
.item.sel>g,.item:focus-visible>g{filter:drop-shadow(0 0 4px #FF5B00) drop-shadow(0 0 2px #FF5B00)}
.item:focus{outline:none}
.item.dragging{cursor:grabbing;filter:drop-shadow(0 8px 6px rgba(11,34,51,.35))}
#notebook{position:absolute;inset:0;overflow:auto;padding:18px 22px;color:var(--ink);background:var(--card)}
#notebook h3{margin:0 0 6px;font-size:18px}
#notebook .exam{background:#fff;border:1.5px solid #111;border-radius:6px;padding:14px 16px;color:#111;max-width:760px}
#notebook .exam ol{margin:6px 0 0;padding-left:22px}
#notebook .schemes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:14px;max-width:760px}
#notebook .schemes figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
#notebook .schemes figcaption{font-size:13px;color:#333;margin-top:4px}
#notebook table{border-collapse:collapse;margin-top:14px;font-size:13px;background:#fff;color:#111}
#notebook th,#notebook td{border:1px solid #111;padding:5px 8px;text-align:center}


/* Поверх сцены: выбор места, сообщения, Кори — не сдвигают раскладку */
.pick{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:70%;background:rgba(255,255,255,.96);border-radius:20px;padding:6px 8px 6px 14px;box-shadow:0 6px 20px rgba(11,34,51,.18);z-index:6;color:var(--ink);font-weight:700;font-size:14px}
.toast{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);max-width:min(620px,80%);background:#14324A;color:#fff;border-radius:16px;padding:10px 16px;font-size:14.5px;font-weight:600;box-shadow:0 8px 24px rgba(11,34,51,.3);z-index:6;pointer-events:none}
.toast[data-kind="env"]{background:#B4400A}
.kori-spot{position:absolute;right:.5%;top:0;z-index:5;pointer-events:none;--kori-size:150px}
.kori-spot .kori__bubble{font-family:var(--font);font-size:15px}
.square{cursor:grab;outline:none}
.square.dragging{cursor:grabbing}
.square:focus-visible{filter:drop-shadow(0 0 4px #FF5B00)}
/* Формулы дробью и памятки */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 .15em;font-size:.95em}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.box.formula{font:700 26px var(--mono);text-align:center;background:var(--teal-soft)}
.box.nb{background:#FFF7DC;border-left:4px solid #E3B23C}
.box.nb>b:first-child{display:block;color:#8A6416;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.tbl-wrap{overflow-x:auto}
.dens-t{width:100%;border-collapse:collapse;margin-top:6px;font-size:13.5px}
.dens-t th{color:var(--muted);font-size:12px;text-align:right}
.dens-t td{padding:2px 0}
.dens-t td+td{text-align:right;font-family:var(--mono);color:var(--ink)}
table.big{border-collapse:collapse;background:#fff;color:#111;font-size:12px}
table.big th,table.big td{border:1px solid #111;padding:4px 6px;text-align:center;white-space:nowrap}
table.big.mini{font-size:11px}
table.big.mini td{height:18px}
</style>

    wrong:        { group: 'Неверно',   title: 'Задумался',            when: 'первая ошибка в задаче',                          pose: 'think',   motion: 'ponder',  fx: [],                   phrases: ['Хм… давай проверим', 'Где не сходится?', 'Посмотри ещё раз'], hold: 2600 },
